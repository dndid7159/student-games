<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조문 RPG: 마음을 전하는 길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe3ea; --ink:#1c2230; --win:#1d2540; --winText:#f4f5f8; --winBorder:#f4f5f8;
  --stage1:#3a4566; --stage2:#1d2540; --candle:#f0b44c; --good:#5fae86; --bad:#d9626b;
  --muted:#5b6478; --chip:#ffffff; --chipBorder:#c5cbd8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131c; --ink:#e6e8ee; --win:#161c33; --winText:#eef0f5; --winBorder:#cfd4e2;
    --stage1:#262e48; --stage2:#0f1426; --muted:#99a1b5; --chip:#1b2134; --chipBorder:#323a55;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c; --ink:#e6e8ee; --win:#161c33; --winText:#eef0f5; --winBorder:#cfd4e2;
  --stage1:#262e48; --stage2:#0f1426; --muted:#99a1b5; --chip:#1b2134; --chipBorder:#323a55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Batang","Noto Serif KR",serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-family:"Do Hyeon",system-ui,sans-serif;font-size:1.05rem;margin-bottom:10px}
.hud .place{font-size:1.25rem}
.hearts{letter-spacing:2px}
.hud button{font:inherit;background:var(--chip);color:var(--ink);border:2px solid var(--chipBorder);border-radius:6px;padding:2px 10px;cursor:pointer}

/* stage */
.stage{position:relative;height:250px;border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,var(--stage1),var(--stage2));border:4px solid var(--win)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:rgba(0,0,0,.25);border-top:2px solid rgba(255,255,255,.08)}
.stage .props{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:5%;padding-bottom:40px;font-size:clamp(2.2rem,7vw,3.4rem)}
.stage .props span{display:inline-block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.player{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.smoke{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(230,232,240,.35);filter:blur(3px);animation:rise 4s linear infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.8}100%{opacity:0;transform:translate(18px,-150px) scale(2.4)}}
.stage .tag{position:absolute;top:10px;left:12px;color:#fff;font-family:"Do Hyeon",sans-serif;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:3px}
.chapter{position:absolute;top:10px;right:12px;color:#fff;font-family:"Do Hyeon",sans-serif;opacity:.8}

/* RPG window */
.win{position:relative;margin-top:12px;background:var(--win);color:var(--winText);
  border:3px solid var(--winBorder);outline:3px solid var(--win);border-radius:6px;padding:18px 20px 16px;min-height:190px}
.speaker{position:absolute;top:-16px;left:16px;background:var(--win);border:3px solid var(--winBorder);border-radius:4px;padding:0 12px;font-family:"Do Hyeon",sans-serif;font-size:1.05rem}
.text{font-size:1.12rem;white-space:pre-line;min-height:3.4em}
.next{position:absolute;right:16px;bottom:8px;animation:blink 1s steps(2) infinite;font-size:.9rem}
@keyframes blink{50%{opacity:0}}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{text-align:left;font:inherit;font-size:1.02rem;color:var(--winText);background:transparent;border:2px solid rgba(255,255,255,.25);border-radius:4px;padding:8px 12px 8px 30px;cursor:pointer;position:relative}
.choice:hover,.choice:focus-visible{border-color:var(--candle);outline:none}
.choice:hover::before,.choice:focus-visible::before{content:"▶";position:absolute;left:10px;color:var(--candle);font-size:.8rem;top:12px}
.choice.sel{border-color:var(--candle);background:rgba(240,180,76,.14)}
.choice.done{opacity:.4;text-decoration:line-through;cursor:default}
.choice.ok{border-color:var(--good);background:rgba(95,174,134,.18)}
.choice.no{border-color:var(--bad);background:rgba(217,98,107,.18)}
.btn{font-family:"Do Hyeon",sans-serif;font-size:1.05rem;background:var(--candle);color:#1d2540;border:0;border-radius:4px;padding:8px 18px;cursor:pointer;margin-top:12px}
.btn:focus-visible{outline:3px solid var(--winText);outline-offset:2px}
.feedback{margin-top:12px;padding:10px 12px;border-left:4px solid;border-radius:2px;background:rgba(255,255,255,.06)}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
.feedback b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.1rem}
.order-slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:36px}
.slot{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.4);border-radius:3px;padding:4px 10px;font-size:.95rem}
input.name{font:inherit;font-size:1.1rem;padding:8px 10px;border-radius:4px;border:2px solid var(--winBorder);background:transparent;color:var(--winText);width:min(260px,100%);margin-top:10px}
.title-art{font-family:"Do Hyeon",sans-serif;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.2;margin:0 0 4px}

/* book */
.book{margin-top:18px}
.book h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.3rem;margin:0 0 8px}
.book ol{margin:0;padding-left:1.4em}
.book li{margin-bottom:6px}
.book .empty{color:var(--muted)}
.result-rank{font-family:"Do Hyeon",sans-serif;font-size:1.8rem;color:var(--candle)}
@media (max-width:520px){.stage{height:200px}.text{font-size:1.02rem}.win{padding:18px 14px 14px}}
@media (prefers-reduced-motion:reduce){.player,.smoke,.next{animation:none}.smoke{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud" aria-live="polite">
    <span class="place" id="place">조문 RPG</span>
    <span>예절 점수 <b id="score">0</b></span>
    <span class="hearts" id="hearts" aria-label="마음 HP"></span>
    <button id="bookBtn" type="button">예절 도감 <span id="bookCount">0</span></button>
  </div>

  <div class="stage" id="stage">
    <div class="floor"></div>
    <div class="props" id="props"></div>
    <div class="tag" id="tag">시작</div>
    <div class="chapter" id="chapter"></div>
  </div>

  <div class="win" id="win">
    <div class="speaker" id="speaker" hidden></div>
    <div id="body"></div>
  </div>

  <section class="book" id="book" hidden>
    <h2>예절 도감</h2>
    <ol id="bookList"></ol>
    <p class="empty" id="bookEmpty">아직 모은 예절이 없어요. 퀘스트를 진행해 보세요.</p>
  </section>
</div>

<script>
/* =========================================================
   교사용 안내: 아래 SCENES 배열만 고치면 내용이 바뀝니다.
   type: "talk"(대화) / "choice"(하나 고르기) / "multi"(여러 개 고르기)
         / "order"(순서 맞추기) / "end"(결과)
   ========================================================= */
const MAX_HP = 5;
const SCENES = [
  { type:"talk", place:"우리 집", props:["🏠","🧑‍🎓","📱"], speaker:"나레이션",
    text:"월요일 저녁, 반 단톡방에 소식이 올라왔다.\n\"민준이 할머니께서 돌아가셨대. 내일 같이 조문 가자.\"" },
  { type:"talk", place:"우리 집", props:["🏠","🧑‍🎓","📱"], speaker:"{name}",
    text:"조문은 처음인데... 실수하면 어쩌지?\n하나씩 차근차근 준비해 보자!" },

  { type:"multi", place:"우리 집", chapter:"퀘스트 1 · 복장", props:["👔","🧑‍🎓","👟"], speaker:"퀘스트",
    text:"장례식장에 갈 차림을 골라 보자. 알맞은 것을 모두 고른 뒤 [확인]을 눌러.",
    options:[
      {t:"단정하게 입은 교복 (또는 검은색·짙은 색 옷)", ok:true},
      {t:"검은색 양말", ok:true},
      {t:"단정하게 묶거나 정리한 머리", ok:true},
      {t:"형광색 운동화", ok:false},
      {t:"반짝이는 큰 귀걸이·액세서리", ok:false},
      {t:"진한 향수", ok:false}
    ],
    tip:"복장: 검은색이나 짙은 무채색의 단정한 옷을 입는다. 학생은 교복을 단정히 입으면 된다. 화려한 색, 액세서리, 진한 향수는 피한다." },

  { type:"choice", place:"가는 길", chapter:"퀘스트 2 · 마음가짐", props:["🚌","🧑‍🎓","🧑"], speaker:"친구 서연",
    text:"\"민준이 많이 슬프겠지? 우리가 웃긴 얘기 해서 분위기 좀 띄워 줄까?\"",
    options:[
      {t:"\"그건 좀 아닌 것 같아. 조용히 곁에 있어 주는 게 더 위로가 될 거야.\"", ok:true,
       fb:"맞아. 장례식장에서는 큰 소리나 장난을 삼가고, 조용히 슬픔을 함께 나누는 것이 예의야."},
      {t:"\"좋아! 재밌는 영상도 보여 주자.\"", ok:false,
       fb:"유족은 깊은 슬픔 속에 있어. 웃고 떠드는 행동은 오히려 상처가 될 수 있어."},
      {t:"\"그냥 가서 사진 찍고 바로 나오자.\"", ok:false,
       fb:"장례식장에서 사진 촬영은 삼가야 해. 조문은 유족을 위로하러 가는 자리야."}
    ],
    tip:"마음가짐: 장례식장에서는 큰 소리, 장난, 사진 촬영을 삼가고 차분한 태도를 유지한다." },

  { type:"talk", place:"장례식장 입구", props:["🏢","🧑‍🎓","🧑"], speaker:"나레이션",
    text:"장례식장에 도착했다. 입구 옆 접수대에 조객록(방명록)과 부의함이 놓여 있다." },

  { type:"choice", place:"접수대", chapter:"퀘스트 3 · 조객록", props:["📖","🧑‍🎓","🗳️"], speaker:"퀘스트",
    text:"조객록(조문객이 이름을 남기는 책)을 어떻게 할까?",
    options:[
      {t:"내 이름을 또박또박 바르게 적는다.", ok:true,
       fb:"좋아! 조객록은 유족이 나중에 누가 다녀갔는지 확인하고 감사 인사를 전할 때 쓰여."},
      {t:"친구 이름까지 장난스럽게 적어 준다.", ok:false,
       fb:"조객록은 유족에게 소중한 기록이야. 각자 본인의 이름을 바르게 적어야 해."},
      {t:"귀찮으니 그냥 지나친다.", ok:false,
       fb:"조객록에 이름을 남기면 유족이 나의 위로를 기억할 수 있어. 꼭 적자."}
    ],
    tip:"조객록: 빈소에 들어가기 전 접수대의 조객록에 본인 이름을 바르게 적는다." },

  { type:"choice", place:"접수대", chapter:"퀘스트 4 · 부의금 봉투", props:["✉️","🧑‍🎓","🗳️"], speaker:"퀘스트",
    text:"부모님이 챙겨 주신 부의금(장례를 돕기 위한 돈) 봉투. 봉투 앞면에는 어떤 글을 쓸까?",
    options:[
      {t:"賻儀(부의) 또는 謹弔(근조)", ok:true,
       fb:"정답! '부의'는 상가에 보내는 돈이라는 뜻, '근조'는 삼가 조의를 표한다는 뜻이야. 이름은 봉투 뒷면 왼쪽 아래에 적어."},
      {t:"祝 結婚(축 결혼)", ok:false,
       fb:"이건 결혼식 봉투에 쓰는 말이야. 장례식에는 '부의'나 '근조'를 써."},
      {t:"생일 축하해!", ok:false,
       fb:"축하 문구는 절대 안 돼. 장례식 봉투에는 '부의'나 '근조'를 써."}
    ],
    tip:"부의금 봉투: 앞면에 賻儀(부의)·謹弔(근조), 뒷면 왼쪽 아래에 이름을 쓴다. 부의함에 넣거나 접수대에 전달한다. 학생은 형편에 맞게, 부의금이 없어도 진심 어린 조문이 가장 중요하다." },

  { type:"talk", place:"빈소", props:["🖼️","🕯️","🧑‍🎓","🧑"], speaker:"나레이션",
    text:"빈소 안으로 들어섰다. 고인의 영정 사진 앞에 향과 국화가 놓여 있고, 옆에는 상주(유족 대표)인 민준이네 가족이 서 있다.\n먼저 상주에게 가볍게 목례하고 영정 앞으로 나아간다.", smoke:true },

  { type:"order", place:"빈소", chapter:"퀘스트 5 · 분향", props:["🖼️","🕯️","🧑‍🎓"], speaker:"퀘스트",
    text:"분향(향을 피워 올리는 것)을 할 차례! 올바른 순서대로 눌러 보자.",
    steps:[
      "오른손으로 향을 1개 또는 3개 집는다",
      "촛불에 향 끝을 대어 불을 붙인다",
      "왼손으로 가볍게 흔들어 불꽃을 끈다",
      "향로에 공손히 꽂는다"
    ],
    tip:"분향: 향을 집어 촛불에 붙이고 → 손으로 흔들어 불꽃을 끄고 → 향로에 꽂는다. 향불은 절대 입으로 불어 끄지 않는다.", smoke:true },

  { type:"choice", place:"빈소", props:["🖼️","🕯️","🧑‍🎓"], speaker:"돌발 상황!",
    text:"앗, 향에 붙은 불꽃이 잘 꺼지지 않는다! 어떻게 할까?",
    options:[
      {t:"손으로 조금 더 흔들거나 부채질하듯 해서 끈다.", ok:true,
       fb:"정답! 향불은 손으로 흔들거나 부채질해서 꺼야 해."},
      {t:"입으로 후~ 불어서 끈다.", ok:false,
       fb:"입으로 부는 건 실례야. 사람의 입김은 부정하다고 여기는 전통이 있어서 반드시 손으로 꺼."}
    ], smoke:true },

  { type:"choice", place:"빈소", chapter:"퀘스트 6 · 헌화", props:["🖼️","🌼","🧑‍🎓"], speaker:"서연",
    text:"\"다른 장례식장에선 향 대신 국화를 올리던데, 그땐 어떻게 해?\"\n(종교나 유족의 뜻에 따라 분향 대신 헌화를 하기도 해.)",
    options:[
      {t:"오른손으로 줄기를 잡고 왼손으로 받쳐, 꽃송이가 영정 쪽을 향하게 놓는다.", ok:true,
       fb:"맞아! 꽃은 고인께 드리는 것이니 꽃송이가 영정을 향하게 놓아."},
      {t:"꽃송이가 나를 향하게 놓는다.", ok:false,
       fb:"헌화는 고인께 꽃을 바치는 거야. 꽃송이가 영정 쪽을 향하도록 놓아."},
      {t:"한 송이씩 꽃잎을 뿌린다.", ok:false,
       fb:"꽃잎을 뿌리지 않아. 한 송이를 공손히 제단에 올려놓아."}
    ],
    tip:"헌화: 오른손으로 꽃줄기를 잡고 왼손으로 받쳐, 꽃송이가 영정을 향하도록 제단에 놓는다." },

  { type:"choice", place:"빈소", chapter:"퀘스트 7 · 공수", props:["🖼️","🙇","🧑‍🎓"], speaker:"퀘스트",
    text:"절하기 전 두 손을 모으는 자세를 '공수'라고 해. 장례식 같은 흉사(슬픈 일)에서 손의 위치는?",
    options:[
      {t:"남자는 오른손이 위, 여자는 왼손이 위", ok:true,
       fb:"정답! 평소(남자 왼손 위, 여자 오른손 위)와 반대로 한다는 점을 기억하자."},
      {t:"남자는 왼손이 위, 여자는 오른손이 위", ok:false,
       fb:"그건 평소나 기쁜 일 때의 공수야. 흉사 때는 반대로 남자 오른손 위, 여자 왼손 위."},
      {t:"아무렇게나 해도 상관없다", ok:false,
       fb:"공수는 예를 표하는 기본자세야. 흉사 때는 남자 오른손 위, 여자 왼손 위."}
    ],
    tip:"공수: 흉사(장례) 때는 평소와 반대로 남자는 오른손, 여자는 왼손을 위로 한다." },

  { type:"choice", place:"빈소", chapter:"퀘스트 8 · 영정에 절", props:["🖼️","🕯️","🙇"], speaker:"퀘스트",
    text:"영정 앞에서 절을 올린다. 몇 번 할까?",
    options:[
      {t:"두 번 (큰절 재배)", ok:true,
       fb:"맞아. 고인께는 두 번 절해. 종교적 이유로 절을 하지 않는다면 잠시 묵념하거나 기도해도 괜찮아."},
      {t:"한 번", ok:false,
       fb:"한 번은 살아 있는 사람에게 하는 절이야. 고인께는 두 번 절해."},
      {t:"세 번", ok:false,
       fb:"고인께는 두 번 절하는 것이 일반적이야."}
    ],
    tip:"영정 앞 절: 고인께 큰절을 두 번 한다. 종교에 따라 묵념이나 기도로 대신할 수 있다." },

  { type:"choice", place:"빈소", chapter:"퀘스트 9 · 상주와 인사", props:["🧑‍🎓","🙇","🧑"], speaker:"퀘스트",
    text:"이제 상주(민준이네 가족)와 마주 섰다. 어떻게 인사할까?",
    options:[
      {t:"상주와 맞절을 한 번 하거나, 정중하게 고개 숙여 인사한다.", ok:true,
       fb:"좋아! 상주와는 한 번 맞절하거나 정중히 목례해."},
      {t:"하이파이브를 한다.", ok:false,
       fb:"장난스러운 인사는 삼가자. 맞절 한 번 또는 정중한 목례가 예의야."},
      {t:"두 번 절한다.", ok:false,
       fb:"두 번 절은 고인께 하는 거야. 상주와는 한 번 맞절해."}
    ],
    tip:"상주와 인사: 상주와 한 번 맞절하거나 정중하게 고개 숙여 인사한다." },

  { type:"choice", place:"빈소", chapter:"퀘스트 10 · 위로의 말", props:["🧑‍🎓","💬","🧑"], speaker:"민준",
    text:"(눈이 빨개진 민준이가 작게 말한다)\n\"...와 줘서 고마워.\"",
    options:[
      {t:"\"삼가 고인의 명복을 빌어. 얼마나 마음이 아프니...\"", ok:true,
       fb:"진심이 담긴 짧은 한마디면 충분해. 말을 길게 하지 않고, 슬픔에 공감해 주는 게 가장 큰 위로야."},
      {t:"\"할머니는 어떻게 돌아가셨어?\"", ok:false,
       fb:"고인이 돌아가신 이유를 꼬치꼬치 묻는 것은 실례야. 유족이 먼저 말하지 않으면 묻지 않아."},
      {t:"\"오래 사셨으니 호상이네!\"", ok:false,
       fb:"'호상'은 유족이 아닌 사람이 함부로 쓰면 상처가 될 수 있는 말이야. 삼가자."},
      {t:"\"힘내! 파이팅!\"", ok:false,
       fb:"응원하는 마음은 좋지만, 장례식장에서는 너무 가벼운 표현이야. 차분하게 위로를 전하자."}
    ],
    tip:"위로의 말: \"삼가 고인의 명복을 빕니다\"처럼 짧고 진심 어린 말을 건넨다. 사망 원인을 묻거나 '호상' 같은 말은 삼간다." },

  { type:"choice", place:"빈소", chapter:"퀘스트 11 · 물러나기", props:["🧑‍🎓","🚪"], speaker:"퀘스트",
    text:"인사를 마쳤다. 빈소에서 어떻게 나갈까?",
    options:[
      {t:"두세 걸음 뒤로 물러난 뒤, 몸을 돌려 조용히 나온다.", ok:true,
       fb:"정답! 바로 등을 보이지 않고 뒤로 물러났다가 돌아 나오는 것이 예의야."},
      {t:"바로 뒤돌아 빠르게 걸어 나간다.", ok:false,
       fb:"영정과 상주에게 바로 등을 보이는 건 예의에 어긋나. 두세 걸음 물러난 뒤 돌아서자."}
    ],
    tip:"물러나기: 두세 걸음 뒤로 물러난 다음 몸을 돌려 조용히 나온다." },

  { type:"choice", place:"접객실", chapter:"퀘스트 12 · 식사 자리", props:["🍚","🧑‍🎓","🥤","🧑"], speaker:"친구 지호",
    text:"유족이 마련한 음식을 먹는 자리. 지호가 음료 컵을 들며 외친다.\n\"자, 다 같이 건배~!\"",
    options:[
      {t:"\"여기선 잔을 부딪치지 않아. 조용히 먹자.\"", ok:true,
       fb:"맞아! 장례식장에서는 건배를 하지 않고, 조용히 음식을 먹으며 고인을 추모해."},
      {t:"\"건배~!\" 하고 컵을 부딪친다.", ok:false,
       fb:"건배는 기쁜 일을 축하할 때 하는 거야. 장례식장에서는 하지 않아."},
      {t:"휴대폰 게임을 소리 켜고 한다.", ok:false,
       fb:"휴대폰은 무음으로! 큰 소리는 유족과 다른 조문객에게 방해가 돼."}
    ],
    tip:"접객실: 건배하지 않고, 휴대폰은 무음으로 하며, 조용히 식사한다. 너무 오래 머물지 않는다." },

  { type:"talk", place:"돌아가는 길", props:["🌙","🧑‍🎓","🧑"], speaker:"{name}",
    text:"처음엔 떨렸지만, 민준이에게 진심을 전할 수 있어서 다행이야.\n예절은 결국 슬픔에 잠긴 사람을 배려하는 마음이구나." },

  { type:"end", place:"퀘스트 완료", props:["🏅","🧑‍🎓","🌼"] }
];

/* ================= 게임 엔진 ================= */
const S = { i:-1, name:"", score:0, hp:MAX_HP, book:[], mistakes:0 };
const $ = id => document.getElementById(id);
let typing = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fill(s){ return (s||"").replaceAll("{name}", S.name||"나"); }

function hud(){
  $("score").textContent = S.score;
  $("hearts").textContent = "❤️".repeat(S.hp) + "🤍".repeat(MAX_HP - S.hp);
  $("bookCount").textContent = S.book.length;
  const list = $("bookList"); list.innerHTML = "";
  S.book.forEach(t => { const li=document.createElement("li"); li.textContent=t; list.appendChild(li); });
  $("bookEmpty").hidden = S.book.length > 0;
}
function learn(tip){ if(tip && !S.book.includes(tip)){ S.book.push(tip); hud(); } }
function right(){ S.score += 10; hud(); }
function wrong(){ S.mistakes++; S.hp = Math.max(0, S.hp-1); S.score = Math.max(0, S.score-3); hud(); return S.hp === 0; }
function isDead(){ return S.hp === 0; }

/* 하트가 모두 떨어졌을 때: 틀린 이유를 먼저 보여 준 뒤 이 버튼으로 게임 오버 화면으로 이동 */
function gameOverButton(area){
  const b = document.createElement("button"); b.className="btn"; b.type="button";
  b.textContent = "마음 HP가 모두 떨어졌어요";
  b.onclick = gameOver; area.appendChild(b); b.focus();
}

function gameOver(){
  clearInterval(typing); typing=null;
  setStage({place:"게임 오버", props:["🕯️","🧑‍🎓","💭"]});
  $("chapter").textContent = "";
  setSpeaker("게임 오버");
  const reached = SCENES[S.i] && SCENES[S.i].chapter ? SCENES[S.i].chapter : "";
  $("body").innerHTML = `
    <div class="text">마음 HP가 모두 떨어졌어요.</div>
    <p>${reached ? esc(reached) + "에서 멈췄어요. " : ""}괜찮아요, 실수하면서 배우는 거예요.<br>
    아래 예절 도감을 읽어 보고 처음부터 다시 도전해 봐요!</p>`;
  const again = document.createElement("button"); again.className="btn"; again.type="button";
  again.textContent = "처음부터 다시 도전";
  again.onclick = ()=>{
    const keepName = S.name;
    Object.assign(S,{i:-1,score:0,hp:MAX_HP,book:[],mistakes:0,name:keepName});
    $("book").hidden = true; hud(); next();
  };
  const toTitle = document.createElement("button"); toTitle.className="btn"; toTitle.type="button";
  toTitle.textContent = "타이틀로"; toTitle.style.marginLeft = "8px";
  toTitle.onclick = start;
  $("body").appendChild(again); $("body").appendChild(toTitle);
  $("book").hidden = false;
  again.focus();
}

function setStage(sc){
  $("place").textContent = sc.place || "";
  $("tag").textContent = sc.place || "";
  $("chapter").textContent = sc.chapter || "";
  const props = $("props"); props.innerHTML = "";
  (sc.props||[]).forEach(p => {
    const sp = document.createElement("span"); sp.textContent = p;
    if(p==="🧑‍🎓") sp.className="player";
    props.appendChild(sp);
  });
  document.querySelectorAll(".smoke").forEach(e=>e.remove());
  if(sc.smoke){
    for(let k=0;k<6;k++){
      const d=document.createElement("div"); d.className="smoke";
      d.style.left = (44 + Math.random()*10) + "%";
      d.style.bottom = "110px";
      d.style.animationDelay = (k*0.65)+"s";
      $("stage").appendChild(d);
    }
  }
}

function setSpeaker(name){
  const sp = $("speaker");
  if(name){ sp.hidden=false; sp.textContent = fill(name); } else sp.hidden=true;
}

function typeText(el, text, done){
  clearInterval(typing);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ el.textContent = text; done&&done(); return; }
  let n = 0; el.textContent = "";
  typing = setInterval(()=>{
    n++; el.textContent = text.slice(0,n);
    if(n>=text.length){ clearInterval(typing); typing=null; done&&done(); }
  }, 28);
  el._finish = ()=>{ clearInterval(typing); typing=null; el.textContent=text; done&&done(); };
}

function next(){ S.i++; render(); }

function render(){
  const sc = SCENES[S.i];
  setStage(sc); setSpeaker(sc.speaker);
  const body = $("body"); body.innerHTML = "";
  const txt = document.createElement("div"); txt.className="text"; body.appendChild(txt);
  const area = document.createElement("div"); body.appendChild(area);

  if(sc.type==="end") return renderEnd(body);

  typeText(txt, fill(sc.text), ()=>{
    if(sc.type==="talk") talk(area);
    if(sc.type==="choice") choice(sc, area);
    if(sc.type==="multi") multi(sc, area);
    if(sc.type==="order") order(sc, area);
  });
  // 클릭하면 글자 바로 표시
  txt.onclick = ()=>{ if(typing && txt._finish) txt._finish(); };
}

function talk(area){
  const b = document.createElement("button"); b.className="btn"; b.type="button"; b.textContent="계속하기 ▼";
  b.onclick = next; area.appendChild(b); b.focus();
}

function showFeedback(area, good, msg, tip, onNext){
  const f = document.createElement("div"); f.className="feedback " + (good?"good":"bad");
  f.innerHTML = `<b>${good?"잘했어요!":"아쉬워요"}</b><br>${esc(msg)}`;
  area.appendChild(f);
  const b = document.createElement("button"); b.className="btn"; b.type="button";
  b.textContent = good ? "다음으로" : "다시 골라 보기";
  b.onclick = onNext; area.appendChild(b); b.focus();
}

function choice(sc, area){
  const box = document.createElement("div"); box.className="choices"; area.appendChild(box);
  const fbArea = document.createElement("div"); area.appendChild(fbArea);
  let firstTry = true;
  // 보기 섞기
  const opts = sc.options.map((o,idx)=>({...o,idx})).sort(()=>Math.random()-.5);
  opts.forEach(o=>{
    const b = document.createElement("button"); b.className="choice"; b.type="button"; b.textContent = o.t;
    b.onclick = ()=>{
      if(b.classList.contains("done")) return;
      box.querySelectorAll("button").forEach(x=>x.disabled=true);
      fbArea.innerHTML = "";
      if(o.ok){
        b.classList.add("ok");
        if(firstTry) right();
        learn(sc.tip);
        showFeedback(fbArea, true, o.fb, sc.tip, next);
      } else {
        b.classList.add("no"); firstTry=false;
        if(wrong()){
          const f=document.createElement("div"); f.className="feedback bad";
          f.innerHTML=`<b>아쉬워요</b><br>${esc(o.fb)}`;
          fbArea.appendChild(f); gameOverButton(fbArea); return;
        }
        showFeedback(fbArea, false, o.fb, null, ()=>{
          fbArea.innerHTML="";
          b.classList.remove("no"); b.classList.add("done");
          box.querySelectorAll("button:not(.done)").forEach(x=>x.disabled=false);
          box.querySelector("button:not(.done)")?.focus();
        });
      }
    };
    box.appendChild(b);
  });
  box.querySelector("button").focus();
}

function multi(sc, area){
  const box = document.createElement("div"); box.className="choices"; area.appendChild(box);
  const picked = new Set();
  const opts = sc.options.map((o,idx)=>({...o,idx})).sort(()=>Math.random()-.5);
  opts.forEach(o=>{
    const b = document.createElement("button"); b.className="choice"; b.type="button";
    b.setAttribute("aria-pressed","false"); b.textContent = o.t;
    b.onclick = ()=>{
      if(picked.has(o.idx)){ picked.delete(o.idx); b.classList.remove("sel"); b.setAttribute("aria-pressed","false"); }
      else { picked.add(o.idx); b.classList.add("sel"); b.setAttribute("aria-pressed","true"); }
    };
    b._o = o; box.appendChild(b);
  });
  const fbArea = document.createElement("div");
  const ok = document.createElement("button"); ok.className="btn"; ok.type="button"; ok.textContent="확인";
  area.appendChild(ok); area.appendChild(fbArea);
  let firstTry = true;
  ok.onclick = ()=>{
    const allRight = sc.options.every((o,idx)=> o.ok === picked.has(idx));
    box.querySelectorAll(".choice").forEach(b=>{
      b.classList.remove("ok","no");
      const isPicked = picked.has(b._o.idx);
      if(isPicked && b._o.ok) b.classList.add("ok");
      if(isPicked && !b._o.ok) b.classList.add("no");
    });
    fbArea.innerHTML="";
    if(allRight){
      ok.hidden = true; box.querySelectorAll("button").forEach(x=>x.disabled=true);
      if(firstTry) right(); learn(sc.tip);
      showFeedback(fbArea, true, sc.tip, null, next);
    } else {
      firstTry=false; wrong();
      const missing = sc.options.filter((o,idx)=>o.ok && !picked.has(idx)).length;
      const extra = sc.options.filter((o,idx)=>!o.ok && picked.has(idx)).length;
      let msg = [];
      if(extra) msg.push(`장례식장에 어울리지 않는 것이 ${extra}개 섞여 있어(빨간색).`);
      if(missing) msg.push(`꼭 필요한 것을 ${missing}개 빠뜨렸어.`);
      const f=document.createElement("div"); f.className="feedback bad";
      if(isDead()){
        f.innerHTML = `<b>아쉬워요</b><br>${esc(msg.join(" "))}`;
        fbArea.appendChild(f);
        ok.hidden = true; box.querySelectorAll("button").forEach(x=>x.disabled=true);
        gameOverButton(fbArea); return;
      }
      f.innerHTML = `<b>아쉬워요</b><br>${esc(msg.join(" "))} 다시 골라서 [확인]을 눌러 봐.`;
      fbArea.appendChild(f);
    }
  };
}

function order(sc, area){
  const slots = document.createElement("div"); slots.className="order-slots"; area.appendChild(slots);
  const box = document.createElement("div"); box.className="choices"; area.appendChild(box);
  const fbArea = document.createElement("div"); area.appendChild(fbArea);
  let step = 0, firstTry = true;
  const shuffled = sc.steps.map((t,idx)=>({t,idx})).sort(()=>Math.random()-.5);
  shuffled.forEach(o=>{
    const b = document.createElement("button"); b.className="choice"; b.type="button"; b.textContent=o.t;
    b.onclick = ()=>{
      fbArea.innerHTML="";
      if(o.idx===step){
        b.classList.add("ok"); b.disabled=true;
        const s=document.createElement("span"); s.className="slot"; s.textContent=(step+1)+". "+o.t; slots.appendChild(s);
        step++;
        if(step===sc.steps.length){
          if(firstTry) right(); learn(sc.tip);
          showFeedback(fbArea, true, sc.tip, null, next);
        }
      } else {
        firstTry=false; wrong();
        b.classList.add("no"); setTimeout(()=>b.classList.remove("no"),600);
        const f=document.createElement("div"); f.className="feedback bad";
        f.innerHTML=`<b>순서가 달라요</b><br>${step+1}번째로 할 일을 다시 생각해 봐.`;
        fbArea.appendChild(f);
        if(isDead()){
          box.querySelectorAll("button").forEach(x=>x.disabled=true);
          gameOverButton(fbArea);
        }
      }
    };
    box.appendChild(b);
  });
  box.querySelector("button").focus();
}

function renderEnd(body){
  setSpeaker("결과");
  const quests = SCENES.filter(s=>["choice","multi","order"].includes(s.type) && s.tip).length;
  const max = SCENES.filter(s=>["choice","multi","order"].includes(s.type)).length * 10;
  const ratio = S.score / max;
  let rank, msg;
  if(ratio>=0.9){ rank="예절 마스터"; msg="완벽에 가까워요! 어디서든 진심을 바르게 전할 수 있어요."; }
  else if(ratio>=0.7){ rank="성실한 조문객"; msg="대부분 잘 해냈어요. 도감을 보며 헷갈린 부분만 다시 확인해 봐요."; }
  else if(ratio>=0.5){ rank="성장하는 조문객"; msg="기본은 갖췄어요. 한 번 더 도전하면 훨씬 자신감이 생길 거예요."; }
  else { rank="견습 조문객"; msg="처음엔 누구나 헷갈려요. 도감을 읽고 다시 도전해 봐요!"; }
  body.innerHTML = `
    <div class="text">${esc(S.name||"나")}의 조문 여정이 끝났습니다.</div>
    <div class="result-rank">${rank}</div>
    <p>예절 점수 <b>${S.score}</b> / ${max} · 실수 ${S.mistakes}번 · 모은 예절 ${S.book.length} / ${quests}</p>
    <p>${msg}</p>
    <p style="opacity:.85">장례 예절은 지역·집안·종교에 따라 조금씩 다를 수 있어요. 가장 중요한 건 유족의 슬픔을 존중하는 마음이에요.</p>`;
  const again = document.createElement("button"); again.className="btn"; again.type="button"; again.textContent="처음부터 다시 하기";
  again.onclick = start;
  body.appendChild(again);
  $("book").hidden = false; hud();
}

function title(){
  setStage({place:"조문 RPG", props:["🖼️","🕯️","🌼"], smoke:true});
  $("tag").textContent = "시작";
  setSpeaker(null);
  $("body").innerHTML = `
    <h1 class="title-art">조문 RPG: 마음을 전하는 길</h1>
    <p>친구의 할머니 장례식장에 조문을 가게 된 주인공.<br>12개의 퀘스트를 통과하며 장례식 예절을 익혀 보세요.</p>
    <label for="nm">주인공 이름</label><br>
    <input id="nm" class="name" maxlength="10" placeholder="이름을 입력하세요">
    <br><button class="btn" id="go" type="button">모험 시작</button>`;
  $("nm").addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });
  $("go").onclick = ()=>{ S.name = $("nm").value.trim() || "학생"; next(); };
  $("nm").focus();
}

function start(){
  Object.assign(S,{i:-1,score:0,hp:MAX_HP,book:[],mistakes:0});
  $("book").hidden = true; hud(); title();
}

$("bookBtn").onclick = ()=>{ const b=$("book"); b.hidden=!b.hidden; if(!b.hidden) b.scrollIntoView({behavior:"smooth"}); };
start();
</script>
