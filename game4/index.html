<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공유경제 마을 쟁탈전</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:#f4f6f8; color:#222; font-family:Arial,"Noto Sans KR",sans-serif; touch-action:manipulation; }
.wrap { max-width:900px; margin:auto; padding:24px 16px 60px; }
h1 { text-align:center; margin:5px 0; }
.sub { text-align:center; color:#666; margin-bottom:22px; }
.card { background:#fff; border-radius:18px; padding:20px; margin:14px 0; box-shadow:0 3px 14px #0000000d; }
input { width:100%; padding:13px; margin:5px 0; border:1px solid #ddd; border-radius:10px; font-size:16px; }
button { width:100%; padding:14px; margin-top:8px; border:0; border-radius:10px; background:#222; color:white; font-size:16px; font-weight:bold; cursor:pointer; touch-action:manipulation; user-select:none; }
button:disabled { opacity:.4; cursor:not-allowed; }
.hidden { display:none!important; }
.msg { padding:12px; background:#f0f2f4; border-radius:10px; margin-top:10px; white-space:pre-line; line-height: 1.4; }
.code { text-align:center; font-size:42px; font-weight:bold; letter-spacing:8px; margin:12px; }
.players div, .rank div { display:flex; justify-content:space-between; padding:11px 4px; border-bottom:1px solid #eee; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.stat { background:#f5f5f5; border-radius:12px; text-align:center; padding:12px; font-size:14px;}
.num { font-size:21px; font-weight:bold; margin-top:4px; }
.round { font-size:24px; font-weight:bold; }
.choices { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:15px; }
.choice { width:100%; min-height:120px; border:2px solid #ddd; border-radius:14px; padding:16px; background:#fff; color:#222; text-align:left; cursor:pointer; margin:0; touch-action:manipulation; user-select:none; transition: 0.2s; }
.choice:active { transform:scale(.98); }
.choice.sel { border-color:#111; background:#eee; }
.choice b { display:block; font-size:18px; margin-bottom:7px; }
.choice small { color:#666; line-height:1.5; }
.project { border:2px solid #ddd; border-radius:14px; padding:16px; margin-bottom:15px; text-align:center; background:#fdfdfd;}
.big { font-size:20px; font-weight:bold; margin:10px 0; }
.final { text-align:center; }
.final .score { font-size:28px; font-weight:bold; margin-top: 10px; color:#222;}
.style { background:#fff; padding:20px; border-radius:12px; margin-top:15px; border: 2px solid #eee; text-align:left;}
.style-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #111; }
.style-stars { font-size: 15px; color: #555; line-height: 1.6; }
@media(max-width:600px){
    .wrap { padding:16px 12px 40px; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .choices { grid-template-columns:1fr; }
    .choice { min-height:105px; }
}
</style>
</head>
<body>

<div class="wrap">
<h1>🏘️ 공유경제 마을 쟁탈전</h1>
<div class="sub">소유할 것인가, 공유할 것인가?</div>

<!-- 게임 로비 및 시작 -->
<section id="start">
    <div class="card">
        <h2>👑 방 만들기</h2>
        <input id="hostName" maxlength="20" placeholder="방장 이름">
        <button id="createRoomBtn" type="button">방 만들기</button>
    </div>
    <div class="card">
        <h2>🙋 방 참가하기</h2>
        <input id="joinName" maxlength="20" placeholder="내 이름">
        <input id="joinCode" maxlength="4" inputmode="numeric" placeholder="4자리 방 번호">
        <button id="joinRoomBtn" type="button">방 참가</button>
    </div>
    <div id="startMsg" class="msg hidden"></div>
</section>

<!-- 게임 대기실 -->
<section id="lobby" class="hidden">
    <div class="card">
        <h2>🏘️ 게임 대기실</h2>
        <div>방 번호</div>
        <div id="roomCode" class="code"></div>
        <div id="hostText"></div>
    </div>
    <div class="card">
        <h2>👥 참가자</h2>
        <div id="lobbyPlayers" class="players"></div>
        <div id="lobbyCount" class="msg"></div>
    </div>
    <div id="hostStart" class="card hidden">
        <h2>🎮 게임 시작</h2>
        <p>참가자가 모두 들어오면 시작하세요.</p>
        <button id="startGameBtn" type="button">게임 시작</button>
    </div>
</section>

<!-- 메인 게임 화면 -->
<section id="game" class="hidden">
    <div class="card">
        <div id="roundTitle" class="round"></div>
        <p id="roundDesc"></p>
        <div id="statusMsg" class="msg"></div>
    </div>

    <!-- 스탯 -->
    <div class="card">
        <div class="stats">
            <div class="stat">💰 돈<div id="money" class="num">1000</div></div>
            <div class="stat">🌱 환경<div id="environment" class="num">50</div></div>
            <div class="stat">🤝 공동체<div id="community" class="num">50</div></div>
            <div class="stat">😊 만족도<div id="satisfaction" class="num">50</div></div>
        </div>
    </div>

    <!-- 공통 선택 상자 (일반/프로젝트 통합) -->
    <div id="choiceBox" class="card hidden">
        <h2>🤔 당신의 선택은?</h2>
        
        <div id="projectInfo" class="project hidden">
            <div class="big" id="piName"></div>
            <div id="piDesc"></div>
            <div style="margin-top: 10px;">현재 참여 확정: <strong id="piCount">0</strong>명 / 최소 <span id="piMin"></span>명</div>
            <div>(현재 기준 예상 비용: 1인당 <strong id="piCost">0</strong>원)</div>
        </div>

        <div id="choices" class="choices"></div>
        <button id="confirm" type="button" disabled>선택 확정</button>
    </div>

    <!-- 방장 컨트롤 (결과 산출) -->
    <div id="hostControl" class="card hidden">
        <button id="resolveRoundBtn" type="button">📊 전체 선택 종료 및 결과 산출</button>
    </div>

    <!-- 결과 안내 창 -->
    <div id="resultBox" class="card hidden">
        <h2>📊 라운드 결과</h2>
        <div id="resultText" class="msg">결과를 불러오는 중입니다...</div>
        <button id="nextRoundBtn" type="button" class="hidden">다음 라운드 진행</button>
    </div>

    <div class="card">
        <h2>🏆 현재 순위 (이전 라운드 기준)</h2>
        <div id="ranking" class="rank"></div>
    </div>
</section>

<!-- 최종 결과 화면 -->
<section id="final" class="hidden">
    <div class="card final">
        <h1>🏆 최종 결과</h1>
        <p>게임이 종료되었습니다! 여러분의 소비 성향을 확인해보세요.</p>
        <div id="finalList"></div>
    </div>
</section>

</div>

<script>
const SUPABASE_URL = "https://lfqgowhcfwrmtvxivyjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_NSxWcogbVY6qWPBOdWivcg_sQzfFQop";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TOTAL = 10;
let roomId = null, roomCode = null, playerId = null, host = false;
let roundNo = 0, currentRenderedRound = 0;
let selected = null, poll = null;

// 라운드 데이터
const rounds = [
{ n:1, title:"🚗 이동수단", desc:"학교에 가기 위한 이동수단을 선택하세요.", choices:[ { id:"car", t:"🚗 개인 자동차", d:"편리하지만 비용과 환경 부담이 큽니다.", m:-300, e:-10, c:0, s:15 }, { id:"carshare", t:"🚙 카셰어링", d:"필요할 때만 차를 함께 이용합니다.", m:-100, e:5, c:10, s:5, share:1 }, { id:"bus", t:"🚌 대중교통", d:"저렴하고 환경 부담이 적습니다.", m:-50, e:10, c:5, s:-5 }, { id:"bike", t:"🚲 자전거", d:"가장 친환경적인 이동 방법입니다.", m:-20, e:15, c:5, s:-5 } ] },
{ n:2, title:"🏠 주거", desc:"새로운 집을 선택해야 합니다.", choices:[ { id:"big", t:"🏠 넓은 집", d:"공간은 넓지만 비용과 에너지 소비가 큽니다.", m:-250, e:-10, c:0, s:20 }, { id:"small", t:"🏡 작은 집", d:"비용과 에너지 소비를 줄입니다.", m:-100, e:5, c:0, s:5 }, { id:"sharehouse", t:"🏘️ 공유주택", d:"주거 공간과 시설을 함께 사용합니다.", m:-70, e:10, c:15, s:-5, share:1 } ] },
{ n:3, title:"🍳 식생활", desc:"오늘 저녁을 어떻게 해결할까요?", choices:[ { id:"delivery", t:"🍱 배달음식", d:"편하지만 비용과 포장 쓰레기가 발생합니다.", m:-100, e:-5, c:0, s:15 }, { id:"cook", t:"🍳 직접 요리", d:"저렴하고 환경 부담도 적습니다.", m:-40, e:5, c:0, s:5 }, { id:"kitchen", t:"🍲 공동주방", d:"여러 사람이 함께 요리합니다.", m:-30, e:10, c:15, s:5, share:1 } ] },
{ n:4, title:"🔨 물건 구매", desc:"전동 드릴이 필요합니다.", choices:[ { id:"newtool", t:"🛠️ 새 제품 구매", d:"내 물건으로 편하게 사용할 수 있습니다.", m:-150, e:-5, c:0, s:10 }, { id:"usedtool", t:"♻️ 중고 구매", d:"자원을 절약하면서 저렴하게 구합니다.", m:-60, e:10, c:5, s:5 }, { id:"toolshare", t:"🤝 공구 공유", d:"필요한 사람끼리 함께 사용합니다.", m:-20, e:15, c:15, s:0, share:1 } ] },
{ n:5, title:"👕 의생활", desc:"새로운 옷이 필요합니다.", choices:[ { id:"newclothes", t:"👕 새 옷 구매", d:"원하는 옷을 새 제품으로 구합니다.", m:-120, e:-10, c:0, s:15 }, { id:"usedclothes", t:"♻️ 중고 옷", d:"사용하던 옷을 다시 활용합니다.", m:-40, e:10, c:5, s:5 }, { id:"clotheshare", t:"👚 의류 공유", d:"필요한 옷을 다른 사람과 공유합니다.", m:-20, e:15, c:15, s:0, share:1 } ] },
{ n:6, title:"📱 디지털 생활", desc:"새로운 태블릿이 필요합니다.", choices:[ { id:"tablet", t:"📱 새 제품", d:"최신 제품을 구입합니다.", m:-250, e:-10, c:0, s:15 }, { id:"usedtablet", t:"♻️ 중고 제품", d:"사용하던 제품을 다시 활용합니다.", m:-100, e:10, c:5, s:5 }, { id:"tabletshare", t:"🤝 공유 태블릿", d:"필요한 시간에 함께 사용합니다.", m:-40, e:10, c:15, s:0, share:1 } ] },
{ n:7, title:"🏖️ 여가", desc:"주말에 무엇을 할까요?", choices:[ { id:"trip", t:"🏖️ 개인 여행", d:"자유롭고 만족도가 높습니다.", m:-180, e:-10, c:0, s:20 }, { id:"stay", t:"🏡 공유 숙소", d:"숙박 공간을 함께 이용합니다.", m:-80, e:5, c:10, s:10, share:1 }, { id:"event", t:"🎉 마을 공동행사", d:"이웃들과 함께 시간을 보냅니다.", m:-30, e:5, c:20, s:10 } ] },
{ n:8, title:"⚡ 갑작스러운 사건", desc:"마을에 갑작스러운 정전이 발생했습니다.", choices:[ { id:"generator", t:"🔋 개인 발전기", d:"미리 준비한 개인 발전기를 사용합니다.", m:-100, e:-5, c:0, s:10 }, { id:"sharedgen", t:"🔋 공유 발전기", d:"여러 사람이 공동으로 사용합니다.", m:-40, e:5, c:15, s:5, share:1 }, { id:"wait", t:"🕯️ 그냥 기다린다", d:"돈은 들지 않지만 불편합니다.", m:0, e:5, c:0, s:-15 } ] },
{ n:9, type:"project", title:"🤝 공동 세탁방", desc:"마을에 공동 세탁방을 만들 수 있습니다.", project:{ id:"laundry", name:"공동 세탁방", cost:500, min:3, env:15, comm:20, sat:5 } },
{ n:10, title:"🌳 마지막 선택", desc:"마을의 마지막 자금을 어디에 투자할까요?", choices:[ { id:"env", t:"🌳 환경 프로젝트", d:"마을의 환경을 크게 개선합니다.", m:0, e:30, c:5, s:5 }, { id:"platform", t:"🤝 공유 플랫폼", d:"공유경제 서비스를 발전시킵니다.", m:0, e:10, c:30, s:5 }, { id:"shop", t:"🏪 개인 상점 투자", d:"개인적인 경제적 이익을 얻습니다.", m:150, e:-5, c:-5, s:10 } ] }
];

function esc(x){ const d = document.createElement("div"); d.textContent = x ?? ""; return d.innerHTML; }
function msg(x){ const e = document.getElementById("startMsg"); e.textContent = x; e.classList.remove("hidden"); }
function hideStartMsg(){ document.getElementById("startMsg").classList.add("hidden"); }

// 방 관리 로직
async function createRoom(){
    const name = document.getElementById("hostName").value.trim();
    if(!name){ msg("방장 이름을 입력해주세요."); return; }
    hideStartMsg(); document.getElementById("createRoomBtn").disabled = true;
    try{
        let code = null;
        for(let i=0;i<30;i++){
            const c = String(Math.floor(1000 + Math.random()*9000));
            const {data} = await client.from("rooms").select("id").eq("room_code",c).maybeSingle();
            if(!data){ code = c; break; }
        }
        const { data:r } = await client.from("rooms").insert({ room_code:code, host_name:name, status:"waiting", current_round:0 }).select().single();
        const { data:p } = await client.from("players").insert({ room_id:r.id, player_name:name, is_host:true, money:1000, environment:50, community:50, satisfaction:50, score:0 }).select().single();
        roomId = r.id; roomCode = code; playerId = p.id; host = true; roundNo = 0; currentRenderedRound = 0; showLobby();
    }catch(e){ msg("방 만들기 실패"); document.getElementById("createRoomBtn").disabled = false; }
}

async function joinRoom(){
    const name = document.getElementById("joinName").value.trim();
    const code = document.getElementById("joinCode").value.trim();
    if(!name || !/^\d{4}$/.test(code)){ msg("이름과 4자리 방 번호를 확인하세요."); return; }
    hideStartMsg(); document.getElementById("joinRoomBtn").disabled = true;
    try{
        const { data:r } = await client.from("rooms").select("*").eq("room_code",code).maybeSingle();
        if(!r || r.status !== "waiting"){ msg("입장할 수 없는 방입니다."); document.getElementById("joinRoomBtn").disabled = false; return; }
        const { data:p } = await client.from("players").insert({ room_id:r.id, player_name:name, is_host:false, money:1000, environment:50, community:50, satisfaction:50, score:0 }).select().single();
        roomId = r.id; roomCode = code; playerId = p.id; host = false; roundNo = 0; currentRenderedRound = 0; showLobby();
    }catch(e){ msg("참가 실패"); document.getElementById("joinRoomBtn").disabled = false; }
}

function showLobby(){
    document.getElementById("start").classList.add("hidden");
    document.getElementById("lobby").classList.remove("hidden");
    document.getElementById("roomCode").textContent = roomCode;
    document.getElementById("hostText").textContent = host ? "👑 방장: " + document.getElementById("hostName").value.trim() : "방장 대기중...";
    document.getElementById("hostStart").classList.toggle("hidden", !host);
    refreshLobby();
    poll = setInterval(refreshRoom, 1000);
}

async function refreshLobby(){
    if(!roomId) return;
    const { data } = await client.from("players").select("*").eq("room_id",roomId).order("created_at");
    const box = document.getElementById("lobbyPlayers"); box.innerHTML = "";
    (data || []).forEach(p=>{
        box.innerHTML += `<div><span>${esc(p.player_name)} ${p.is_host ? "👑" : ""}</span><span>${p.id === playerId ? "나" : ""}</span></div>`;
    });
    document.getElementById("lobbyCount").textContent = `현재 ${data?.length || 0}명 참가`;
}

async function startGame(){
    if(!host) return;
    document.getElementById("startGameBtn").disabled = true;
    await client.from("rooms").update({ status:"playing", current_round:1 }).eq("id",roomId);
}

// 핵심 주기적 상태 체크
async function refreshRoom(){
    if(!roomId) return;
    const { data:r } = await client.from("rooms").select("*").eq("id",roomId).single();
    if(!r) return;

    if(r.status === "waiting") {
        await refreshLobby();
        return;
    }
    
    if(r.status === "playing"){
        const newRound = Number(r.current_round);
        if(document.getElementById("game").classList.contains("hidden")){
            roundNo = newRound; showGame();
        } else if(newRound !== currentRenderedRound){
            roundNo = newRound; renderGame();
        } else {
            // 공동 프로젝트 실시간 카운트 갱신
            if(rounds[roundNo - 1]?.type === "project") updateProjectRealtime();
        }
    }
    
    if (r.status === "resolving") {
        document.getElementById("choiceBox").classList.add("hidden");
        document.getElementById("resultBox").classList.remove("hidden");
        document.getElementById("hostControl").classList.add("hidden");
        
        if (host) document.getElementById("nextRoundBtn").classList.remove("hidden");
        await displayRoundResult(); 
    }

    if(r.status === "finished" && document.getElementById("final").classList.contains("hidden")){
        await showFinal();
    }
}

function showGame(){
    document.getElementById("lobby").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    renderGame();
}

async function renderGame(){
    const rd = rounds[roundNo - 1];
    if(!rd) return;
    currentRenderedRound = roundNo; selected = null;
    
    document.getElementById("roundTitle").textContent = `ROUND ${rd.n} · ${rd.title}`;
    document.getElementById("roundDesc").textContent = rd.desc;
    document.getElementById("resultBox").classList.add("hidden");
    document.getElementById("statusMsg").textContent = "선택을 골라주세요.";
    document.getElementById("choiceBox").classList.remove("hidden");
    document.getElementById("hostControl").classList.toggle("hidden", !host);
    document.getElementById("resolveRoundBtn").disabled = false;

    await stats(); await ranking();

    if(rd.type === "project"){
        document.getElementById("projectInfo").classList.remove("hidden");
        document.getElementById("piName").textContent = rd.project.name;
        document.getElementById("piDesc").textContent = `총 필요 자금 ${rd.project.cost}원`;
        document.getElementById("piMin").textContent = rd.project.min;
        await updateProjectRealtime();
    } else {
        document.getElementById("projectInfo").classList.add("hidden");
    }

    await renderChoices(rd);
}

async function stats(){
    if(!playerId) return;
    const { data:p } = await client.from("players").select("*").eq("id",playerId).single();
    if(p){
        document.getElementById("money").textContent = p.money ?? 1000;
        document.getElementById("environment").textContent = p.environment ?? 50;
        document.getElementById("community").textContent = p.community ?? 50;
        document.getElementById("satisfaction").textContent = p.satisfaction ?? 50;
    }
}

// 공동 프로젝트 실시간 현황
async function updateProjectRealtime() {
    const rd = rounds[roundNo - 1];
    if(!rd || rd.type !== "project") return;
    const { data } = await client.from("player_choices").select("choice_id").eq("room_id", roomId).eq("round_number", roundNo);
    const joins = (data || []).filter(c => c.choice_id === "join").length;
    const cost = joins > 0 ? Math.ceil(rd.project.cost / joins) : rd.project.cost;
    document.getElementById("piCount").textContent = joins;
    document.getElementById("piCost").textContent = cost;
}

// 선택지 렌더링 및 클릭 토글 로직
async function renderChoices(rd){
    const { data:mine } = await client.from("player_choices").select("choice_id").eq("room_id",roomId).eq("player_id",playerId).eq("round_number",roundNo).maybeSingle();
    const alreadyChosen = !!mine;
    if(alreadyChosen) selected = mine.choice_id;

    const choicesEl = document.getElementById("choices"); choicesEl.innerHTML = "";
    
    // 프로젝트 라운드인 경우 선택지 강제 생성
    let choicesList = rd.type === "project" ? [
        { id:"join", t:"✅ 프로젝트 참여", d:"자금을 모아 마을에 공동 시설을 세웁니다." },
        { id:"pass", t:"❌ 참여하지 않기", d:"참여하지 않고 개인 자금을 아낍니다." }
    ] : rd.choices;

    choicesList.forEach(c=>{
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "choice" + (selected === c.id ? " sel" : "");
        btn.innerHTML = `<b>${c.t}</b><small>${c.d}</small>`;
        
        btn.addEventListener("click", () => {
            if(alreadyChosen) return;
            
            // 토글 기능: 선택된 것을 다시 누르면 취소
            if (selected === c.id) {
                selected = null;
                btn.classList.remove("sel");
                document.getElementById("confirm").disabled = true;
                document.getElementById("statusMsg").textContent = "선택을 골라주세요.";
            } else {
                selected = c.id;
                document.querySelectorAll(".choice").forEach(el=>el.classList.remove("sel"));
                btn.classList.add("sel");
                document.getElementById("confirm").disabled = false;
                document.getElementById("statusMsg").textContent = `선택 대기중: ${c.t}\n아래 '선택 확정' 버튼을 눌러야 최종 반영됩니다.`;
            }
        });
        choicesEl.appendChild(btn);
    });

    const confirm = document.getElementById("confirm");
    confirm.disabled = alreadyChosen || !selected;
    if(alreadyChosen) document.getElementById("statusMsg").textContent = "✅ 선택 확정 완료! 다른 참가자를 기다려주세요.";
}

async function confirmChoice(){
    if(!selected) return;
    document.getElementById("confirm").disabled = true;
    await client.from("player_choices").upsert({ room_id:roomId, player_id:playerId, round_number:roundNo, choice_id:selected }, { onConflict: "room_id,player_id,round_number" });
    document.getElementById("statusMsg").textContent = "✅ 선택 확정 완료! 방장의 다음 진행을 기다려주세요.";
    document.querySelectorAll(".choice").forEach(el=> el.disabled = true);
}

/* =========================================================
   [수정됨] 결과 산출 및 방어 로직 (방장 전용) 
========================================================= */
document.getElementById("resolveRoundBtn").addEventListener("click", async () => {
    if(!host) return;
    
    const {data: players} = await client.from("players").select("*").eq("room_id", roomId);
    const {data: choices} = await client.from("player_choices").select("*").eq("room_id", roomId).eq("round_number", roundNo);
    
    // 1. 모든 참가자가 선택을 완료했는지 확인
    if (choices.length < players.length) {
        alert(`⚠️ 아직 모든 참가자가 선택을 완료하지 않았습니다!\n(완료: ${choices.length}명 / 전체: ${players.length}명)`);
        return;
    }

    document.getElementById("resolveRoundBtn").disabled = true;
    const rd = rounds[roundNo - 1];
    const choiceCounts = {};
    choices.forEach(c => { choiceCounts[c.choice_id] = (choiceCounts[c.choice_id] || 0) + 1; });
    
    // 2. 결과 DB 적용 로직 
    if (rd.type === "project") {
        const joins = choiceCounts["join"] || 0;
        if (joins >= rd.project.min) {
            const costPer = Math.ceil(rd.project.cost / joins);
            for (let p of players) {
                const myChoice = choices.find(x => x.player_id === p.id);
                if (myChoice && myChoice.choice_id === "join") {
                    p.money -= costPer; p.environment += rd.project.env; p.community += rd.project.comm; p.satisfaction += rd.project.sat;
                }
            }
        }
    } else {
        const overThreshold = Math.max(3, Math.floor(players.length * 0.4));
        for (let p of players) {
            const myChoice = choices.find(x => x.player_id === p.id);
            if(myChoice) {
                const cData = rd.choices.find(x => x.id === myChoice.choice_id);
                if(cData) {
                    p.money += cData.m || 0; p.environment += cData.e || 0; p.community += cData.c || 0; p.satisfaction += cData.s || 0;
                    if (cData.share && choiceCounts[cData.id] >= overThreshold) p.satisfaction -= 10;
                    else if (!cData.share && cData.m <= -150 && choiceCounts[cData.id] >= overThreshold) p.environment -= 10;
                }
            }
        }
    }

    // 최종 스코어 계산 및 일괄 업데이트
    for (let p of players) {
        const formulaScore = Math.floor(p.money / 10) + (p.environment * 2) + (p.community * 2) + (p.satisfaction * 2);
        await client.from("players").update({ money: p.money, environment: p.environment, community: p.community, satisfaction: p.satisfaction, score: formulaScore }).eq("id", p.id);
    }

    await client.from("rooms").update({ status: "resolving" }).eq("id", roomId);
});

// 클라이언트 공통: 라운드 결과 도출 텍스트 (동적 멘트 적용)
async function displayRoundResult() {
    await stats(); 
    await ranking(); 
    
    const rd = rounds[roundNo - 1];
    let text = "";

    const {data: choices} = await client.from("player_choices").select("*").eq("room_id", roomId).eq("round_number", roundNo);
    const {data: players} = await client.from("players").select("id").eq("room_id", roomId);
    
    const counts = {}; (choices || []).forEach(c => { counts[c.choice_id] = (counts[c.choice_id] || 0) + 1; });

    if (rd.type === "project") {
        const joins = counts["join"] || 0;
        if (joins >= rd.project.min) {
            text = `🎉 <b>${rd.project.name} 건설 성공!</b>\n총 ${joins}명이 합심하여 자금을 모았습니다.\n(참여자: 공동체 및 환경 점수 상승, 자금 차감)`;
        } else {
            text = `❌ <b>${rd.project.name} 무산</b>\n참여 인원이 부족하여 프로젝트가 취소되었습니다. 투자된 자금은 소모되지 않았습니다.`;
        }
    } else {
        const overThreshold = Math.max(3, Math.floor(players.length * 0.4));
        let events = [];
        
        rd.choices.forEach(c => {
            if(counts[c.id] >= overThreshold) {
                if (c.share) events.push(`⚠️ 너무 많은 사람이 <b>[${c.t}]</b>을(를) 선택해 대기시간이 발생했습니다! (해당 유저 만족도 하락)`);
                else if (c.m <= -150) events.push(`🌫️ 과도한 <b>[${c.t}]</b> 소비로 마을에 환경 부담이 가중되었습니다! (해당 유저 환경 점수 하락)`);
            }
        });

        if (events.length > 0) {
            text = events.join("\n\n");
        } else {
            // 페널티가 없을 때 무조건 똑같은 멘트가 나오는 것을 방지 (가장 많이 득표한 선택지 찾기)
            const maxChoiceId = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, null);
            const maxChoiceData = rd.choices.find(c => c.id === maxChoiceId);
            
            if (maxChoiceData) {
                text = `✅ 무난하고 평화로운 라운드였습니다.\n가장 많은 주민들이 <b>[${maxChoiceData.t}]</b>을(를) 선택하여 일상을 보냈습니다.`;
            } else {
                text = "마을 사람들이 각자의 성향대로 다양한 선택을 한 라운드였습니다.";
            }
        }
    }
    
    document.getElementById("resultText").innerHTML = text;
}

document.getElementById("nextRoundBtn").addEventListener("click", async () => {
    if(!host) return;
    if (roundNo >= TOTAL) await client.from("rooms").update({ status: "finished" }).eq("id", roomId);
    else await client.from("rooms").update({ status: "playing", current_round: roundNo + 1 }).eq("id", roomId);
});

async function ranking(){
    const { data } = await client.from("players").select("*").eq("room_id",roomId).order("score", { ascending: false });
    const rankBox = document.getElementById("ranking"); rankBox.innerHTML = "";
    (data || []).forEach((p, i) => {
        rankBox.innerHTML += `<div><span>${i+1}위. ${esc(p.player_name)}</span> <span>${p.score || 0}점</span></div>`;
    });
}

function getPlayerStyle(p) {
    const eco = p.environment || 0;
    const comm = p.community || 0;
    const sat = p.satisfaction || 0;
    const mon = Math.floor((p.money || 0) / 10);
    
    const maxVal = Math.max(eco, comm, sat, mon);
    let title = "⚖️ 균형형 시민";
    
    if (Math.abs(eco - comm) <= 10 && Math.abs(comm - sat) <= 10) title = "⚖️ 균형형 시민";
    else if (maxVal === eco) title = "🌱 친환경 시민";
    else if (maxVal === comm) title = "🤝 공동체 시민";
    else if (maxVal === sat) title = "😊 욜로(YOLO) 시민";
    else if (maxVal === mon) title = "💰 경제형 시민";

    const getStars = (val) => {
        if(val >= 80) return "★★★★★";
        if(val >= 60) return "★★★★☆";
        if(val >= 40) return "★★★☆☆";
        if(val >= 20) return "★★☆☆☆";
        return "★☆☆☆☆";
    }

    return `
        <div class="style">
            <div class="style-title">${title} : ${esc(p.player_name)}</div>
            <div class="style-stars">
                💰 경제: ${getStars(mon)} <br>
                🌱 환경: ${getStars(eco)} <br>
                🤝 공동체: ${getStars(comm)} <br>
                😊 만족도: ${getStars(sat)}
            </div>
            <div class="score">종합 ${p.score || 0}점</div>
        </div>
    `;
}

async function showFinal() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
    const { data } = await client.from("players").select("*").eq("room_id",roomId).order("score", { ascending: false });
    
    const finalList = document.getElementById("finalList"); finalList.innerHTML = "";
    (data || []).forEach((p, i) => {
        const medal = i === 0 ? "🥇 1위" : (i === 1 ? "🥈 2위" : (i === 2 ? "🥉 3위" : `${i+1}위`));
        finalList.innerHTML += `<div class="big" style="margin-top:20px;">${medal}</div>` + getPlayerStyle(p);
    });
    clearInterval(poll);
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("createRoomBtn").addEventListener("click", createRoom);
    document.getElementById("joinRoomBtn").addEventListener("click", joinRoom);
    document.getElementById("startGameBtn").addEventListener("click", startGame);
    document.getElementById("confirm").addEventListener("click", confirmChoice);
});
