/* =====================================================
   공통 함수
===================================================== */

function esc(text){

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;
}


function showStartMessage(text){

  const el =
    document.getElementById("startMsg");

  el.textContent = text;

  el.classList.remove("hidden");
}


function hideStartMessage(){

  document
    .getElementById("startMsg")
    .classList.add("hidden");
}


/* =====================================================
   방 만들기
===================================================== */

async function createRoom(){

  const name =
    document
      .getElementById("hostName")
      .value
      .trim();


  if(!name){

    showStartMessage(
      "방장 이름을 입력해주세요."
    );

    return;
  }


  hideStartMessage();


  try{

    let code = null;


    /* 방 번호 만들기 */

    for(let i=0;i<30;i++){

      const candidate =
        String(
          Math.floor(
            1000 +
            Math.random()*9000
          )
        );


      const {
        data,
        error
      } =
        await sb
          .from("rooms")
          .select("id")
          .eq("room_code",candidate)
          .maybeSingle();


      if(error){
        throw error;
      }


      if(!data){

        code =
          candidate;

        break;
      }
    }


    if(!code){

      throw new Error(
        "방 번호 생성에 실패했습니다."
      );
    }


    /* 방 생성 */

    const {
      data:room,
      error:roomError
    } =
      await sb
        .from("rooms")
        .insert({

          room_code:code,

          host_name:name,

          status:"waiting",

          current_round:0

        })
        .select()
        .single();


    if(roomError){
      throw roomError;
    }


    /* 방장 플레이어 생성 */

    const {
      data:player,
      error:playerError
    } =
      await sb
        .from("players")
        .insert({

          room_id:room.id,

          player_name:name,

          is_host:true,

          score:0

        })
        .select()
        .single();


    if(playerError){
      throw playerError;
    }


    roomId =
      room.id;

    roomCode =
      code;

    playerId =
      player.id;

    isHost =
      true;


    showLobby();


  }catch(error){

    console.error(
      "CREATE ROOM ERROR:",
      error
    );


    showStartMessage(
      "방 만들기 실패\n" +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );
  }
}


/* =====================================================
   방 참가
===================================================== */

async function joinRoom(){

  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  const code =
    document
      .getElementById("joinCode")
      .value
      .trim();


  if(!name){

    showStartMessage(
      "이름을 입력해주세요."
    );

    return;
  }


  if(!/^\d{4}$/.test(code)){

    showStartMessage(
      "4자리 방 번호를 입력해주세요."
    );

    return;
  }


  hideStartMessage();


  try{

    const {
      data:room,
      error:roomError
    } =
      await sb
        .from("rooms")
        .select("*")
        .eq("room_code",code)
        .maybeSingle();


    if(roomError){
      throw roomError;
    }


    if(!room){

      showStartMessage(
        "존재하지 않는 방입니다."
      );

      return;
    }


    if(room.status !== "waiting"){

      showStartMessage(
        "이미 시작된 방입니다."
      );

      return;
    }


    const {
      data:player,
      error:playerError
    } =
      await sb
        .from("players")
        .insert({

          room_id:room.id,

          player_name:name,

          is_host:false,

          score:0

        })
        .select()
        .single();


    if(playerError){
      throw playerError;
    }


    roomId =
      room.id;

    roomCode =
      code;

    playerId =
      player.id;

    isHost =
      false;


    showLobby();


  }catch(error){

    console.error(
      "JOIN ROOM ERROR:",
      error
    );


    showStartMessage(
      "방 참가 실패\n" +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );
  }
}


/* =====================================================
   대기실
===================================================== */

function showLobby(){

  document
    .getElementById("start")
    .classList
    .add("hidden");


  document
    .getElementById("lobby")
    .classList
    .remove("hidden");


  document
    .getElementById("roomCode")
    .textContent =
      roomCode;


  document
    .getElementById("hostText")
    .textContent =
      isHost
      ? "👑 방장: " +
        document
          .getElementById("hostName")
          .value
          .trim()
      : "👑 방장 정보를 불러오는 중";


  document
    .getElementById("hostStart")
    .classList
    .toggle(
      "hidden",
      !isHost
    );


  refreshLobby();


  clearInterval(
    pollTimer
  );


  pollTimer =
    setInterval(
      refreshRoom,
      1000
    );
}


async function refreshLobby(){

  if(!roomId){
    return;
  }


  const {
    data,
    error
  } =
    await sb
      .from("players")
      .select("*")
      .eq("room_id",roomId)
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    return;
  }


  const box =
    document
      .getElementById("lobbyPlayers");


  box.innerHTML = "";


  (data || [])
    .forEach(player=>{

      const row =
        document
          .createElement("div");


      row.innerHTML =
        `<span>
          ${esc(player.player_name)}
          ${player.is_host ? " 👑" : ""}
        </span>

        <span>
          ${
            player.id === playerId
            ? "나"
            : ""
          }
        </span>`;


      box.appendChild(row);
    });


  document
    .getElementById("lobbyCount")
    .textContent =
      `현재 ${data?.length || 0}명 참가`;
}


/* =====================================================
   게임 시작
===================================================== */

async function startGame(){

  if(!isHost){
    return;
  }


  const {
    error
  } =
    await sb
      .from("rooms")
      .update({

        status:"playing",

        current_round:1,

        round_started_at:
          new Date().toISOString()

      })
      .eq("id",roomId);


  if(error){

    alert(
      error.message
    );
  }
}


/* =====================================================
   방 상태 확인
===================================================== */

async function refreshRoom(){

  if(!roomId){
    return;
  }


  const {
    data:room,
    error
  } =
    await sb
      .from("rooms")
      .select("*")
      .eq("id",roomId)
      .single();


  if(error || !room){
    return;
  }


  if(room.status === "waiting"){

    await refreshLobby();

    return;
  }


  if(room.status === "playing"){

    roundNo =
      room.current_round;


    const gameHidden =
      document
        .getElementById("game")
        .classList
        .contains("hidden");


    if(gameHidden){

      showGame();

    }else{

      await renderGame();
    }

    return;
  }


  if(room.status === "finished"){

    await showFinal();
  }
}


/* =====================================================
   게임 화면
===================================================== */

function showGame(){

  document
    .getElementById("lobby")
    .classList
    .add("hidden");


  document
    .getElementById("game")
    .classList
    .remove("hidden");


  renderGame();
}


async function renderGame(){

  const round =
    rounds[roundNo - 1];


  if(!round){
    return;
  }


  document
    .getElementById("roundTitle")
    .textContent =
      `ROUND ${round.n} · ${round.title}`;


  document
    .getElementById("roundDesc")
    .textContent =
      round.desc;


  document
    .getElementById("hostControl")
    .classList
    .toggle(
      "hidden",
      !isHost
    );


  document
    .getElementById("resultBox")
    .classList
    .add("hidden");


  await updateStats();


  if(round.type === "project"){

    document
      .getElementById("normalBox")
      .classList
      .add("hidden");


    document
      .getElementById("projectBoxWrap")
      .classList
      .remove("hidden");


    await renderProject(
      round.project
    );


  }else{

    document
      .getElementById("projectBoxWrap")
      .classList
      .add("hidden");


    document
      .getElementById("normalBox")
      .classList
      .remove("hidden");


    await renderChoices(
      round
    );
  }


  await updateRanking();
}


/* =====================================================
   능력치
===================================================== */

async function updateStats(){

  const {
    data:player,
    error
  } =
    await sb
      .from("players")
      .select("*")
      .eq("id",playerId)
      .single();


  if(error || !player){
    return;
  }


  document
    .getElementById("money")
    .textContent =
      player.money ?? 1000;


  document
    .getElementById("environment")
    .textContent =
      player.environment ?? 50;


  document
    .getElementById("community")
    .textContent =
      player.community ?? 50;


  document
    .getElementById("satisfaction")
    .textContent =
      player.satisfaction ?? 50;
}


/* =====================================================
   선택지
===================================================== */

async function renderChoices(round){

  const {
    data:mine,
    error
  } =
    await sb
      .from("player_choices")
      .select("choice_id")
      .eq("room_id",roomId)
      .eq("player_id",playerId)
      .eq("round_number",roundNo)
      .maybeSingle();


  if(error){

    console.error(error);

    return;
  }


  selectedChoice =
    mine?.choice_id || null;


  const choicesBox =
    document
      .getElementById("choices");


  choicesBox.innerHTML = "";


  round.choices
    .forEach(choice=>{

      const card =
        document
          .createElement("div");


      card.className =
        "choice" +
        (
          selectedChoice === choice.id
          ? " sel"
          : ""
        );


      card.innerHTML =
        `<b>${choice.t}</b>
         <small>${choice.d}</small>`;


      card.onclick = ()=>{

        if(mine){
          return;
        }


        selectedChoice =
          choice.id;


        renderChoices(
          round
        );
      };


      choicesBox.appendChild(
        card
      );
    });


  document
    .getElementById("confirm")
    .disabled =
      !!mine ||
      !selectedChoice;


  document
    .getElementById("statusMsg")
    .textContent =
      mine
      ? "✅ 선택 완료! 다른 참가자를 기다리는 중..."
      : "선택을 골라주세요.";
}


/* =====================================================
   선택 확정
===================================================== */

async function confirmChoice(){

  if(!selectedChoice){
    return;
  }


  const {
    error
  } =
    await sb
      .from("player_choices")
      .upsert({

        room_id:roomId,

        player_id:playerId,

        round_number:roundNo,

        choice_id:selectedChoice

      },{
        onConflict:
          "room_id,player_id,round_number"
      });


  if(error){

    console.error(error);

    alert(
      error.message
    );

    return;
  }


  document
    .getElementById("confirm")
    .disabled = true;


  document
    .getElementById("statusMsg")
    .textContent =
      "✅ 선택 완료! 다른 참가자를 기다리는 중...";
}


/* =====================================================
   공동 프로젝트
===================================================== */

async function renderProject(project){

  const {
    data,
    error
  } =
    await sb
      .from("project_participants")
      .select("*")
      .eq("room_id",roomId)
      .eq("project_id",project.id);


  if(error){

    console.error(error);

    return;
  }


  const participants =
    data || [];


  const count =
    participants.length;


  const joined =
    participants.some(
      x =>
        x.player_id === playerId
    );


  const cost =
    count
    ? Math.ceil(
        project.cost / count
      )
    : project.cost;


  document
    .getElementById("projectDesc")
    .textContent =
      `총 비용 ${project.cost}원 · 최소 ${project.min}명 필요`;


  document
    .getElementById("projectBox")
    .innerHTML =
      `<strong>${project.name}</strong>

       <div class="big">
         ${count}명 참여
       </div>

       <p>
         현재 예상 1인 부담금:
         <b>${cost}원</b>
       </p>

       <p>
         참여자가 늘어나면
         1인 부담금이 내려갑니다.
       </p>

       ${
         count < project.min
         ? "❗ 아직 최소 인원 미달"
         : "✅ 최소 인원 충족"
       }`;


  document
    .getElementById("joinProject")
    .disabled =
      joined;


  document
    .getElementById("leaveProject")
    .disabled =
      !joined;


  document
    .getElementById("statusMsg")
    .textContent =
      joined
      ? "✅ 프로젝트 참여 중"
      : "원하면 프로젝트에 참여하세요.";
}


async function joinProject(){

  const project =
    rounds[
      roundNo - 1
    ].project;


  const {
    error
  } =
    await sb
      .from("project_participants")
      .upsert({

        room_id:roomId,

        player_id:playerId,

        project_id:project.id

      },{
        onConflict:
          "room_id,player_id,project_id"
      });


  if(error){

    alert(
      error.message
    );

    return;
  }


  await renderProject(
    project
  );
}


async function leaveProject(){

  const project =
    rounds[
      roundNo - 1
    ].project;


  const {
    error
  } =
    await sb
      .from("project_participants")
      .delete()
      .eq("room_id",roomId)
      .eq("player_id",playerId)
      .eq("project_id",project.id);


  if(error){

    alert(
      error.message
    );

    return;
  }


  await renderProject(
    project
  );
}


/* =====================================================
   라운드 결과
===================================================== */

async function resolveRound(){

  if(!isHost){
    return;
  }


  const round =
    rounds[
      roundNo - 1
    ];


  if(round.type === "project"){

    await resolveProject(
      round.project
    );

    return;
  }


  const {
    data:players,
    error:playersError
  } =
    await sb
      .from("players")
      .select("*")
      .eq("room_id",roomId);


  if(playersError){

    alert(
      playersError.message
    );

    return;
  }


  const {
    data:choices,
    error:choicesError
  } =
    await sb
      .from("player_choices")
      .select("*")
      .eq("room_id",roomId)
      .eq("round_number",roundNo);


  if(choicesError){

    alert(
      choicesError.message
    );

    return;
  }


  if(
    (choices || []).length <
    players.length
  ){

    alert(
      `아직 선택하지 않은 참가자가 있습니다.\n` +
      `현재 ${choices?.length || 0}명 / ${players.length}명 선택`
    );

    return;
  }


  for(
    const player of players
  ){

    const record =
      choices.find(
        x =>
          x.player_id === player.id
      );


    if(!record){
      continue;
    }


    const choice =
      round.choices.find(
        x =>
          x.id === record.choice_id
      );


    if(!choice){
      continue;
    }


    let money =
      (player.money ?? 1000) +
      choice.m;


    let environment =
      (player.environment ?? 50) +
      choice.e;


    let community =
      (player.community ?? 50) +
      choice.c;


    let satisfaction =
      (player.satisfaction ?? 50) +
      choice.s;


    const sameChoice =
      choices.filter(
        x =>
          x.choice_id ===
          choice.id
      ).length;


    if(
      choice.share &&
      sameChoice >=
        Math.ceil(
          players.length * 0.7
        )
    ){

      satisfaction -= 5;
    }


    const {
      error:updateError
    } =
      await sb
        .from("players")
        .update({

          money,

          environment,

          community,

          satisfaction

        })
        .eq(
          "id",
          player.id
        );


    if(updateError){

      console.error(
        updateError
      );

      alert(
        updateError.message
      );

      return;
    }
  }


  document
    .getElementById("resultBox")
    .classList
    .remove("hidden");


  document
    .getElementById("resultText")
    .innerHTML =
      "모든 참가자의 선택이 반영되었습니다." +
      "<br><br>" +
      "🏆 순위를 확인하세요.";


  await updateRanking();


  document
    .getElementById("hostControl")
    .classList
    .add("hidden");
}


/* =====================================================
   공동 프로젝트 결과
===================================================== */

async function resolveProject(project){

  const {
    data:participants
  } =
    await sb
      .from("project_participants")
      .select("*")
      .eq("room_id",roomId)
      .eq("project_id",project.id);


  const list =
    participants || [];


  const count =
    list.length;


  if(
    count <
    project.min
  ){

    document
      .getElementById("resultBox")
      .classList
      .remove("hidden");


    document
      .getElementById("resultText")
      .innerHTML =
        `❌ 프로젝트 실패<br><br>
         최소 ${project.min}명이 필요하지만
         ${count}명만 참여했습니다.`;


    document
      .getElementById("hostControl")
      .classList
      .add("hidden");


    return;
  }


  const cost =
    Math.ceil(
      project.cost /
      count
    );


  const {
    data:players
  } =
    await sb
      .from("players")
      .select("*")
      .eq("room_id",roomId);


  for(
    const participant of list
  ){

    const player =
      players.find(
        x =>
          x.id ===
          participant.player_id
      );


    if(!player){
      continue;
    }


    await sb
      .from("players")
      .update({

        money:
          (player.money ?? 1000)
          - cost,

        environment:
          (player.environment ?? 50)
          + project.env,

        community:
          (player.community ?? 50)
          + project.comm,

        satisfaction:
          (player.satisfaction ?? 50)
          + project.sat

      })
      .eq(
        "id",
        player.id
      );
  }


  document
    .getElementById("resultBox")
    .classList
    .remove("hidden");


  document
    .getElementById("resultText")
    .innerHTML =
      `🎉 공동 프로젝트 성공!<br><br>
       ${count}명이 참여하여
       1인 부담금은 ${cost}원이었습니다.<br>
       참여자에게 환경·공동체·만족도 보너스가 지급되었습니다.`;


  document
    .getElementById("hostControl")
    .classList
    .add("hidden");


  await updateRanking();
}


/* =====================================================
   다음 라운드
===================================================== */

async function nextRound(){

  if(!isHost){
    return;
  }


  if(
    roundNo >=
    TOTAL_ROUNDS
  ){

    const {
      error
    } =
      await sb
        .from("rooms")
        .update({
          status:"finished"
        })
        .eq(
          "id",
          roomId
        );


    if(error){

      alert(
        error.message
      );
    }


    return;
  }


  const {
    error
  } =
    await sb
      .from("rooms")
      .update({

        current_round:
          roundNo + 1,

        round_started_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        roomId
      );


  if(error){

    alert(
      error.message
    );
  }
}


/* =====================================================
   점수 계산
===================================================== */

function calculateScore(player){

  return Math.round(

    (player.money ?? 1000) / 10 +

    (player.environment ?? 50) * 2 +

    (player.community ?? 50) * 2 +

    (player.satisfaction ?? 50) * 2

  );
}


/* =====================================================
   현재 순위
===================================================== */

async function updateRanking(){

  const {
    data,
    error
  } =
    await sb
      .from("players")
      .select("*")
      .eq(
        "room_id",
        roomId
      );


  if(error){

    console.error(
      error
    );

    return;
  }


  const ranking =
    (data || [])
      .map(player=>({

        ...player,

        finalScore:
          calculateScore(
            player
          )

      }))
      .sort(
        (a,b)=>
          b.finalScore -
          a.finalScore
      );


  const box =
    document
      .getElementById("ranking");


  box.innerHTML = "";


  ranking.forEach(
    (player,index)=>{

      const row =
        document
          .createElement("div");


      row.innerHTML =
        `<span>
          ${index+1}위 ·
          ${esc(
            player.player_name
          )}
          ${
            player.id === playerId
            ? " ⭐"
            : ""
          }
        </span>

        <b>
          ${player.finalScore}점
        </b>`;


      box.appendChild(
        row
      );
    }
  );
}


/* =====================================================
   최종 결과
===================================================== */

async function showFinal(){

  clearInterval(
    pollTimer
  );


  document
    .getElementById("game")
    .classList
    .add("hidden");


  document
    .getElementById("lobby")
    .classList
    .add("hidden");


  document
    .getElementById("final")
    .classList
    .remove("hidden");


  const {
    data
  } =
    await sb
      .from("players")
      .select("*")
      .eq(
        "room_id",
        roomId
      );


  const ranking =
    (data || [])
      .map(player=>({

        ...player,

        finalScore:
          calculateScore(
            player
          )

      }))
      .sort(
        (a,b)=>
          b.finalScore -
          a.finalScore
      );


  const box =
    document
      .getElementById(
        "finalList"
      );


  box.innerHTML = "";


  ranking.forEach(
    (player,index)=>{

      let style =
        "⚖️ 균형형 시민";


      const environment =
        player.environment ?? 50;


      const community =
        player.community ?? 50;


      const money =
        (player.money ?? 1000) / 10;


      if(
        environment >
        community &&
        environment >
        money
      ){

        style =
          "🌱 친환경 시민";

      }else if(

        community >
        environment &&
        community >
        money

      ){

        style =
          "🤝 공유경제 시민";

      }else if(

        money >
        environment &&
        money >
        community

      ){

        style =
          "💰 경제형 시민";
      }


      const card =
        document
          .createElement("div");


      card.className =
        "card";


      card.innerHTML =
        `<h2>

          ${
            index === 0
            ? "🥇"
            : index === 1
            ? "🥈"
            : index === 2
            ? "🥉"
            : "🏅"
          }

          ${index+1}위 ·
          ${esc(
            player.player_name
          )}

        </h2>

        <div class="score">

          ${player.finalScore}점

        </div>

        <div class="style">

          ${style}

        </div>

        <p>

          💰 ${player.money ?? 1000}

          · 🌱 ${environment}

          · 🤝 ${community}

          · 😊 ${player.satisfaction ?? 50}

        </p>`;


      box.appendChild(
        card
      );

    }
  );
}
