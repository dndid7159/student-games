/* =========================================================
   공통 함수
========================================================= */

function esc(x){

    const d =
        document.createElement("div");

    d.textContent = x ?? "";

    return d.innerHTML;
}


function msg(x){

    const e =
        document.getElementById("startMsg");

    e.textContent = x;

    e.classList.remove("hidden");
}


function hideStartMsg(){

    document
        .getElementById("startMsg")
        .classList.add("hidden");
}


/* =========================================================
   방 만들기
========================================================= */

async function createRoom(){

    const name =
        document
        .getElementById("hostName")
        .value
        .trim();

    if(!name){

        msg("방장 이름을 입력해주세요.");

        return;
    }

    hideStartMsg();

    const btn =
        document.getElementById("createRoomBtn");

    btn.disabled = true;

    try{

        let code = null;

        for(let i=0;i<30;i++){

            const c =
                String(
                    Math.floor(
                        1000 +
                        Math.random()*9000
                    )
                );

            const {data,error} =
                await client
                .from("rooms")
                .select("id")
                .eq("room_code",c)
                .maybeSingle();

            if(error)
                throw error;

            if(!data){

                code = c;

                break;
            }
        }

        if(!code)
            throw new Error("방 번호 생성 실패");


        const {
            data:r,
            error
        } =
            await client
            .from("rooms")
            .insert({
                room_code:code,
                host_name:name,
                status:"waiting",
                current_round:0
            })
            .select()
            .single();

        if(error)
            throw error;


        const {
            data:p,
            error:pe
        } =
            await client
            .from("players")
            .insert({
                room_id:r.id,
                player_name:name,
                is_host:true,
                score:0
            })
            .select()
            .single();

        if(pe)
            throw pe;


        roomId = r.id;
        roomCode = code;
        playerId = p.id;
        host = true;
        roundNo = 0;
        currentRenderedRound = 0;

   방 참가
========================================================= */

async function joinRoom(){

    const name =
        document
        .getElementById("joinName")
        .value
        .trim();

    const code =
        document
        .getElementById("joinCode")
        .value
        .trim();


    if(!name){

        msg("이름을 입력해주세요.");

        return;
    }


    if(!/^\d{4}$/.test(code)){

        msg("4자리 방 번호를 입력해주세요.");

        return;
    }


    hideStartMsg();

    const btn =
        document.getElementById("joinRoomBtn");

    btn.disabled = true;


    try{

        const {
            data:r,
            error
        } =
            await client
            .from("rooms")
            .select("*")
            .eq("room_code",code)
            .maybeSingle();


        if(error)
            throw error;


        if(!r){

            msg("존재하지 않는 방입니다.");

            return;
        }


        if(r.status !== "waiting"){

            msg("이미 시작된 방입니다.");

            return;
        }


        const {
            data:p,
            error:pe
        } =
            await client
            .from("players")
            .insert({
                room_id:r.id,
                player_name:name,
                is_host:false,
                score:0
            })
            .select()
            .single();


        if(pe)
            throw pe;


        roomId = r.id;
        roomCode = code;
        playerId = p.id;
        host = false;
        roundNo = 0;
        currentRenderedRound = 0;


        showLobby();


    }catch(e){

        console.error(e);

        msg(
            "방 참가 실패\n" +
            (e.message || "알 수 없는 오류")
        );

    }finally{

        btn.disabled = false;
    }
}

/* =========================================================
   방 상태 확인
========================================================= */

async function refreshRoom(){

    if(!roomId)
        return;


    const {
        data:r,
        error
    } =
        await client
        .from("rooms")
        .select("*")
        .eq("id",roomId)
        .single();


    if(error){

        console.error(error);

        return;
    }


    if(!r)
        return;


    /* 게임 진행 중 */

    if(r.status === "playing"){

        const newRound =
            Number(r.current_round);


        /*
         * 핵심 수정 부분
         *
         * 이전 코드에서는 1초마다 renderGame()
         * 을 실행해서 선택지가 다시 만들어졌음.
         *
         * 이제 실제 라운드가 바뀌었을 때만
         * renderGame()을 실행한다.
         */

        if(
            document
            .getElementById("game")
            .classList
            .contains("hidden")
        ){

            roundNo = newRound;

            await showGame();

        }
        else if(
            newRound !== currentRenderedRound
        ){

            roundNo = newRound;

            await renderGame();
        }


        /*
         * 순위와 능력치는 가볍게 갱신.
         * 선택지 DOM은 건드리지 않는다.
         */

        await stats();

        await ranking();

    }


    /* 게임 종료 */

    if(r.status === "finished"){

        if(
            document
            .getElementById("final")
            .classList
            .contains("hidden")
        ){

            await showFinal();
        }
    }
}

async function renderChoices(rd){

    const {
        data:mine,
        error
    } =
        await client
        .from("player_choices")
        .select("choice_id")
        .eq("room_id",roomId)
        .eq("player_id",playerId)
        .eq("round_number",roundNo)
        .maybeSingle();


    if(error){

        console.error(error);

        return;
    }


    const alreadyChosen =
        !!mine;


    /*
     * 이미 DB에 저장된 선택이 있으면
     * 그것을 보여준다.
     *
     * 아직 저장하지 않았다면
     * 현재 selected를 유지한다.
     */

    if(alreadyChosen){

        selected =
            mine.choice_id;

    }


    const choicesEl =
        document
        .getElementById("choices");


    choicesEl.innerHTML = "";


    rd.choices.forEach(c=>{

        /*
         * div가 아니라 button을 사용.
         * 모바일 터치 안정성을 높인다.
         */

        const button =
            document.createElement("button");


        button.type = "button";


        button.className =
            "choice" +
            (
                selected === c.id
                ? " sel"
                : ""
            );


        button.innerHTML =
            `
            <b>${c.t}</b>
            <small>${c.d}</small>
            `;


        /*
         * 모바일에서 click 대신
         * pointerup을 사용해도 되지만,
         * 현재는 일반 click도 모바일에서
         * 안정적으로 동작하도록 button으로 구성.
         */

        button.addEventListener(
            "click",
            function(e){

                e.preventDefault();

                if(alreadyChosen)
                    return;


                selected = c.id;


                /*
                 * 다른 선택지의 선택 상태만
                 * 즉시 바꾼다.
                 *
                 * 서버를 호출하지 않기 때문에
                 * 모바일에서도 즉각 반응한다.
                 */

                document
                    .querySelectorAll(".choice")
                    .forEach(el=>{
                        el.classList.remove("sel");
                    });


                button.classList.add("sel");


                document
                    .getElementById("confirm")
                    .disabled = false;


                document
                    .getElementById("statusMsg")
                    .textContent =
                        `선택됨: ${c.t}\n아래의 '선택 확정' 버튼을 눌러주세요.`;
            }
        );


        choicesEl.appendChild(button);
    });


    const confirm =
        document
        .getElementById("confirm");


    confirm.disabled =
        alreadyChosen ||
        !selected;


    document
        .getElementById("statusMsg")
        .textContent =
            alreadyChosen
            ? "✅ 선택 완료! 다른 참가자를 기다리는 중..."
            : selected
                ? "선택을 확인하고 확정해주세요."
                : "선택을 골라주세요.";
}


/* =========================================================
   선택 확정

async function confirmChoice(){

    if(!selected)

        );


        confirm.disabled = false;

    }


    document
        .getElementById("statusMsg")
        .textContent =
            "✅ 선택 완료! 다른 참가자를 기다리는 중...";

     * 선택 완료 후에는 선택 버튼을
     * 다시 누르지 못하게 한다.
     */

    document
        .querySelectorAll(".choice")
        .forEach(el=>{
            el.disabled = true;
        });
}

async function renderProject(p){

    const {
        data:ps,
        error
    } =
        await client
        .from("project_participants")
        .select("*")
        .eq("room_id",roomId)
        .eq("project_id",p.id);


    if(error){

        console.error(error);

        return;
    }


    const arr = ps || [];

    const count = arr.length;


    const joined =

            x => x.player_id === playerId
        );


    const cost =
        count
        ? Math.ceil(p.cost / count)
        : p.cost;


    document
        .getElementById("projectDesc")
        .textContent =
            `총 비용 ${p.cost}원 · 최소 ${p.min}명 필요`;


    document
        .getElementById("projectBox")
        .innerHTML =
            `
            <strong>${p.name}</strong>

            <div class="big">
                ${count}명 참여
            </div>

            <p>
                현재 예상 1인 부담금:
                <b>${cost}원</b>
            </p>

            <p>
                참여자가 늘어나면
                1인 부담금이 내려갑니다.
            </p>

            ${
                count < p.min
                ? "❗ 아직 최소 인원 미달"
                : "✅ 최소 인원 충족"
            }
            `;


    document
        .getElementById("joinProject")
        .disabled = joined;


    document
        .getElementById("leaveProject")
        .disabled = !joined;


    document
        .getElementById("statusMsg")
        .textContent =
            joined
            ? "✅ 프로젝트 참여 중"
            : "원하면 프로젝트에 참여하세요.";
}

/* =========================================================
   라운드 결과 확인
========================================================= */

async function resolveRound(){

    if(!host)
        return;


    const rd =
        rounds[roundNo - 1];


    if(rd.type === "project"){

        await resolveProject(
            rd.project
        );

        return;
    }


    const {
        data:players,
        error:playersError
    } =
        await client
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(playersError){

        alert(playersError.message);

        return;
    }


    const {
        data:chs,
        error:choicesError
    } =
        await client
        .from("player_choices")
        .select("*")
        .eq("room_id",roomId)
        .eq("round_number",roundNo);


    if(choicesError){

        alert(choicesError.message);

        return;
    }


    if(
        (chs || []).length <
        (players || []).length
    ){

        alert(
            `아직 선택하지 않은 참가자가 있습니다.\n\n` +
            `현재 ${chs?.length || 0}명 / ` +
            `${players.length}명 선택`
        );

        return;
    }


    for(const p of players){

        const rec =
            chs.find(
                x => x.player_id === p.id
            );


        if(!rec)
            continue;


        const c =
            rd.choices.find(
                x => x.id === rec.choice_id
            );


        if(!c)
            continue;


        let m =
            (p.money ?? 1000) +
            c.m;


        let e =
            (p.environment ?? 50) +
            c.e;


        let co =
            (p.community ?? 50) +
            c.c;


        let s =
            (p.satisfaction ?? 50) +
            c.s;


        const same =
            chs.filter(
                x => x.choice_id === c.id
            ).length;


        if(
            c.share &&
            same >=
            Math.ceil(players.length * .7)
        ){

            s -= 5;
        }


        await client
            .from("players")
            .update({
                money:m,
                environment:e,
                community:co,
                satisfaction:s
            })
            .eq("id",p.id);
    }


    document
        .getElementById("resultBox")
        .classList
        .remove("hidden");


    document
        .getElementById("resultText")
        .innerHTML =
            `
            모든 참가자의 선택이 반영되었습니다.
            <br><br>
            🏆 순위를 확인하세요.
            `;


    await stats();

    await ranking();


    document
        .getElementById("hostControl")
        .classList
        .add("hidden");
}


/* =========================================================
   공동 프로젝트 결과
========================================================= */

async function resolveProject(p){

    const {
        data:ps,
        error
    } =
        await client
        .from("project_participants")
        .select("*")
        .eq("room_id",roomId)
        .eq("project_id",p.id);


    if(error){

        alert(error.message);

        return;
    }


    const count =
        (ps || []).length;


    if(count < p.min){

        document
            .getElementById("resultBox")
            .classList
            .remove("hidden");


        document
            .getElementById("resultText")
            .innerHTML =
                `
                ❌ 프로젝트 실패
                <br><br>
                최소 ${p.min}명이 필요하지만
                ${count}명만 참여했습니다.
                `;


        document
            .getElementById("hostControl")
            .classList
            .add("hidden");


        return;
    }


    const cost =
        Math.ceil(p.cost / count);


    const {
        data:players
    } =
        await client
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    for(const x of ps){

        const q =
            players.find(
                z => z.id === x.player_id
            );


        if(!q)
            continue;


        await client
            .from("players")
            .update({
                money:
                    (q.money ?? 1000) -
                    cost,

                environment:
                    (q.environment ?? 50) +
                    p.env,

                community:
                    (q.community ?? 50) +
                    p.comm,

                satisfaction:
                    (q.satisfaction ?? 50) +
                    p.sat
            })
            .eq("id",q.id);
    }


    document
        .getElementById("resultBox")
        .classList
        .remove("hidden");


    document
        .getElementById("resultText")
        .innerHTML =
            `
            🎉 공동 프로젝트 성공!
            <br><br>
            ${count}명이 참여하여
            1인 부담금은 ${cost}원이었습니다.
            <br>
            참여자에게 환경·공동체·만족도
            보너스가 지급되었습니다.
            `;


    document
        .getElementById("hostControl")
        .classList
        .add("hidden");


    await stats();

    await ranking();
}

    if(roundNo >= TOTAL){

        } =
            await client
            .from("rooms")
            .update({
                status:"finished"
            })
            .eq("id",roomId);


        if(error){

            alert(error.message);

            return;
        }


        return;
    }


    const next =
        roundNo + 1;


    const {
        error
    } =
        await client
        .from("rooms")
        .update({
            current_round:next,
            round_started_at:
                new Date().toISOString()
        })
        .eq("id",roomId);


    if(error){

        alert(error.message);

        return;
    }


    roundNo = next;


    await renderGame();
}


/* =========================================================
   점수 계산
========================================================= */

function calc(p){

    return Math.round(
        (p.money ?? 1000) / 10 +
        (p.environment ?? 50) * 2 +
        (p.community ?? 50) * 2 +
        (p.satisfaction ?? 50) * 2
    );
}


/* =========================================================
   현재 순위
========================================================= */

async function ranking(){

    if(!roomId)
        return;


    const {
        data:ps,
        error
    } =
        await client
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(error){

        console.error(error);

        return;
    }


    const a =
        (ps || [])
        .map(p=>({
            ...p,
            fs:calc(p)
        }))
        .sort(
            (x,y)=>y.fs-x.fs
        );


    const rankingEl =
        document
        .getElementById("ranking");


    rankingEl.innerHTML = "";


    a.forEach((p,i)=>{

        const d =
            document.createElement("div");


        d.innerHTML =
            `
            <span>
                ${i+1}위 ·
                ${esc(p.player_name)}
                ${p.id === playerId ? " ⭐" : ""}
            </span>

            <b>
                ${p.fs}점
            </b>
            `;


        rankingEl.appendChild(d);
    });
}

    clearInterval(poll);


    document

    document
        .getElementById("lobby")
        .classList
        .add("hidden");


    document
        .getElementById("final")
        .classList
        .remove("hidden");


    const {
        data:ps,
        error
    } =
        await client
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(error){

        console.error(error);

        return;
    }


    const a =
        (ps || [])
        .map(p=>({
            ...p,
            fs:calc(p)
        }))
        .sort(
            (x,y)=>y.fs-x.fs
        );


    const box =
        document
        .getElementById("finalList");


    box.innerHTML = "";


    a.forEach((p,i)=>{

        let style =
            "⚖️ 균형형 시민";


        const env =
            p.environment ?? 50;


        const co =
            p.community ?? 50;


        const m =
            (p.money ?? 1000) / 10;


        if(
            env > co &&
            env > m
        ){

            style =
                "🌱 친환경 시민";

        }
        else if(
            co > env &&
            co > m
        ){

            style =
                "🤝 공유경제 시민";

        }
        else if(
            m > env &&
            m > co
        ){

            style =
                "💰 경제형 시민";
        }


        const d =
            document.createElement("div");


        d.className = "card";


        d.innerHTML =
            `
            <h2>
                ${
                    i===0
                    ? "🥇"
                    : i===1
                        ? "🥈"
                        : i===2
                            ? "🥉"
                            : "🏅"
                }

                ${i+1}위 ·
                ${esc(p.player_name)}
            </h2>

            <div class="score">
                ${p.fs}점
            </div>

            <div class="style">
                ${style}
            </div>

            <p>
                💰 ${p.money ?? 1000}
                · 🌱 ${env}
                · 🤝 ${co}
                · 😊 ${p.satisfaction ?? 50}
            </p>
            `;


        box.appendChild(d);
    });
}
