<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유경제 마을 쟁탈전</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}h1{text-align:center;margin:5px 0}.sub{text-align:center;color:#666;margin-bottom:22px}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}
input{width:100%;padding:13px;margin:5px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:#222;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#eee;color:#222}.hidden{display:none!important}
.msg{padding:12px;background:#f0f2f4;border-radius:10px;margin-top:10px;white-space:pre-line}
.code{text-align:center;font-size:42px;font-weight:bold;letter-spacing:8px;margin:12px}
.players div,.rank div{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #eee}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f5f5f5;border-radius:12px;text-align:center;padding:12px}.num{font-size:21px;font-weight:bold;margin-top:4px}
.round{font-size:24px;font-weight:bold}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.choice{border:2px solid #ddd;border-radius:14px;padding:16px;cursor:pointer}.choice.sel{border-color:#111;background:#eee}
.choice b{display:block;font-size:18px;margin-bottom:7px}.choice small{color:#666;line-height:1.5}
.project{border:2px solid #ddd;border-radius:14px;padding:16px;margin-top:15px;text-align:center}.big{font-size:23px;font-weight:bold;margin:10px}
.final{text-align:center}.final .score{font-size:34px;font-weight:bold}.style{background:#f5f5f5;padding:15px;border-radius:12px;margin-top:10px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🏘️ 공유경제 마을 쟁탈전</h1>
<div class="sub">소유할 것인가, 공유할 것인가?</div>

<section id="start">
<div class="card"><h2>👑 방 만들기</h2>
<input id="hostName" maxlength="20" placeholder="방장 이름">
<button onclick="createRoom()">방 만들기</button></div>
<div class="card"><h2>🙋 방 참가하기</h2>
<input id="joinName" maxlength="20" placeholder="내 이름">
<input id="joinCode" maxlength="4" inputmode="numeric" placeholder="4자리 방 번호">
<button onclick="joinRoom()">방 참가</button></div>
<div id="startMsg" class="msg hidden"></div>
</section>

<section id="lobby" class="hidden">
<div class="card"><h2>🏘️ 게임 대기실</h2><div>방 번호</div><div id="roomCode" class="code"></div><div id="hostText"></div></div>
<div class="card"><h2>👥 참가자</h2><div id="lobbyPlayers" class="players"></div><div id="lobbyCount" class="msg"></div></div>
<div id="hostStart" class="card hidden"><h2>🎮 게임 시작</h2><p>참가자가 모두 들어오면 시작하세요.</p><button onclick="startGame()">게임 시작</button></div>
</section>

<section id="game" class="hidden">
<div class="card"><div id="roundTitle" class="round"></div><p id="roundDesc"></p><div id="statusMsg" class="msg"></div></div>
<div class="card"><div class="stats">
<div class="stat">💰 돈<div id="money" class="num">1000</div></div>
<div class="stat">🌱 환경<div id="environment" class="num">50</div></div>
<div class="stat">🤝 공동체<div id="community" class="num">50</div></div>
<div class="stat">😊 만족도<div id="satisfaction" class="num">50</div></div>
</div></div>

<div id="normalBox" class="card"><h2>선택하세요</h2><div id="choices" class="choices"></div><button id="confirm" onclick="confirmChoice()" disabled>선택 확정</button></div>

<div id="projectBoxWrap" class="card hidden"><h2>🤝 공동 프로젝트</h2><p id="projectDesc"></p><div id="projectBox" class="project"></div>
<button id="joinProject" onclick="joinProject()">프로젝트 참여하기</button>
<button id="leaveProject" class="secondary" onclick="leaveProject()">참여 취소</button>
</div>

<div id="hostControl" class="card hidden"><button onclick="resolveRound()">라운드 결과 확인</button></div>
<div id="resultBox" class="card hidden"><h2>📊 라운드 결과</h2><div id="resultText"></div><button onclick="nextRound()">다음 라운드</button></div>
<div class="card"><h2>🏆 현재 순위</h2><div id="ranking" class="rank"></div></div>
</section>

<section id="final" class="hidden"><div class="card final"><h1>🏆 최종 결과</h1><div id="finalList"></div></div></section>
</div>

<script>
const URL="https://lfqgowhcfwrmtvxivyjh.supabase.co";
const KEY="sb_publishable_NSxWcogbVY6qWPBOdWivcg_sQzfFQop";
const sb=supabase.createClient(URL,KEY);
const TOTAL=10;
let roomId=null,roomCode=null,playerId=null,host=false,roundNo=0,selected=null,poll=null;

const rounds=[
{n:1,title:"🚗 이동수단",desc:"학교에 가기 위한 이동수단을 선택하세요.",choices:[
{id:"car",t:"🚗 개인 자동차",d:"편리하지만 비용과 환경 부담이 큽니다.",m:-300,e:-10,c:0,s:15},

{id:"bus",t:"🚌 대중교통",d:"저렴하고 환경 부담이 적습니다.",m:-50,e:10,c:5,s:-5},
{id:"bike",t:"🚲 자전거",d:"가장 친환경적인 이동 방법입니다.",m:-20,e:15,c:5,s:-5}]},
{n:2,title:"🏠 주거",desc:"새로운 집을 선택해야 합니다.",choices:[
{id:"big",t:"🏠 넓은 집",d:"공간은 넓지만 비용과 에너지 소비가 큽니다.",m:-250,e:-10,c:0,s:20},
{id:"small",t:"🏡 작은 집",d:"비용과 에너지 소비를 줄입니다.",m:-100,e:5,c:0,s:5},
{id:"sharehouse",t:"🏘️ 공유주택",d:"주거 공간과 시설을 함께 사용합니다.",m:-70,e:10,c:15,s:-5,share:1}]},
{n:3,title:"🍳 식생활",desc:"오늘 저녁을 어떻게 해결할까요?",choices:[
{id:"delivery",t:"🍱 배달음식",d:"편하지만 비용과 포장 쓰레기가 발생합니다.",m:-100,e:-5,c:0,s:15},
{id:"cook",t:"🍳 직접 요리",d:"저렴하고 환경 부담도 적습니다.",m:-40,e:5,c:0,s:5},

{n:4,title:"🔨 물건 구매",desc:"전동 드릴이 필요합니다.",choices:[
{id:"newtool",t:"🛠️ 새 제품 구매",d:"내 물건으로 편하게 사용할 수 있습니다.",m:-150,e:-5,c:0,s:10},
{id:"usedtool",t:"♻️ 중고 구매",d:"자원을 절약하면서 저렴하게 구합니다.",m:-60,e:10,c:5,s:5},
{id:"toolshare",t:"🤝 공구 공유",d:"필요한 사람끼리 함께 사용합니다.",m:-20,e:15,c:15,s:0,share:1}]},

{id:"usedclothes",t:"♻️ 중고 옷",d:"사용하던 옷을 다시 활용합니다.",m:-40,e:10,c:5,s:5},
{id:"clotheshare",t:"👚 의류 공유",d:"필요한 옷을 다른 사람과 공유합니다.",m:-20,e:15,c:15,s:0,share:1}]},
{n:6,title:"📱 디지털 생활",desc:"새로운 태블릿이 필요합니다.",choices:[
{id:"tablet",t:"📱 새 제품",d:"최신 제품을 구입합니다.",m:-250,e:-10,c:0,s:15},
{id:"usedtablet",t:"♻️ 중고 제품",d:"사용하던 제품을 다시 활용합니다.",m:-100,e:10,c:5,s:5},
{id:"tabletshare",t:"🤝 공유 태블릿",d:"필요한 시간에 함께 사용합니다.",m:-40,e:10,c:15,s:0,share:1}]},
{n:7,title:"🏖️ 여가",desc:"주말에 무엇을 할까요?",choices:[
{id:"trip",t:"🏖️ 개인 여행",d:"자유롭고 만족도가 높습니다.",m:-180,e:-10,c:0,s:20},
{id:"stay",t:"🏡 공유 숙소",d:"숙박 공간을 함께 이용합니다.",m:-80,e:5,c:10,s:10,share:1},
{id:"event",t:"🎉 마을 공동행사",d:"이웃들과 함께 시간을 보냅니다.",m:-30,e:5,c:20,s:10}]},
{n:8,title:"⚡ 갑작스러운 사건",desc:"마을에 갑작스러운 정전이 발생했습니다.",choices:[
{id:"generator",t:"🔋 개인 발전기",d:"미리 준비한 개인 발전기를 사용합니다.",m:-100,e:-5,c:0,s:10},
{id:"sharedgen",t:"🔋 공유 발전기",d:"여러 사람이 공동으로 사용합니다.",m:-40,e:5,c:15,s:5,share:1},
{id:"wait",t:"🕯️ 그냥 기다린다",d:"돈은 들지 않지만 불편합니다.",m:0,e:5,c:0,s:-15}]},
{n:9,type:"project",title:"🤝 공동 세탁방",desc:"마을에 공동 세탁방을 만들 수 있습니다.",project:{id:"laundry",name:"공동 세탁방",cost:500,min:3,env:15,comm:20,sat:5}},
{n:10,title:"🌳 마지막 선택",desc:"마을의 마지막 선택입니다.",choices:[
{id:"env",t:"🌳 환경 프로젝트",d:"마을의 환경을 개선합니다.",m:0,e:30,c:5,s:5},
{id:"platform",t:"🤝 공유 플랫폼",d:"공유경제 서비스를 발전시킵니다.",m:0,e:10,c:30,s:5},
{id:"shop",t:"🏪 개인 상점 투자",d:"개인적인 경제적 이익을 얻습니다.",m:150,e:-5,c:-5,s:10}]}
];

function esc(x){let d=document.createElement("div");d.textContent=x;return d.innerHTML}
function msg(x){let e=document.getElementById("startMsg");e.textContent=x;e.classList.remove("hidden")}
async function createRoom(){
 const name=document.getElementById("hostName").value.trim(); if(!name)return msg("방장 이름을 입력해주세요.");
 try{
  let code=null;
  for(let i=0;i<30;i++){let c=String(Math.floor(1000+Math.random()*9000));let {data}=await sb.from("rooms").select("id").eq("room_code",c).maybeSingle();if(!data){code=c;break}}
  if(!code)throw Error("방 번호 생성 실패");
  let {data:r,error}=await sb.from("rooms").insert({room_code:code,host_name:name,status:"waiting",current_round:0}).select().single();if(error)throw error;
  let {data:p,error:pe}=await sb.from("players").insert({room_id:r.id,player_name:name,is_host:true,score:0}).select().single();if(pe)throw pe;
  roomId=r.id;roomCode=code;playerId=p.id;host=true;showLobby();
 }catch(e){console.error(e);msg("방 만들기 실패\n"+e.message)}
}
async function joinRoom(){
 const name=document.getElementById("joinName").value.trim(),code=document.getElementById("joinCode").value.trim();
 if(!name)return msg("이름을 입력해주세요."); if(!/^\d{4}$/.test(code))return msg("4자리 방 번호를 입력해주세요.");
 try{
  let {data:r,error}=await sb.from("rooms").select("*").eq("room_code",code).maybeSingle();if(error)throw error;
  if(!r)return msg("존재하지 않는 방입니다."); if(r.status!=="waiting")return msg("이미 시작된 방입니다.");
  let {data:p,error:pe}=await sb.from("players").insert({room_id:r.id,player_name:name,is_host:false,score:0}).select().single();if(pe)throw pe;
  roomId=r.id;roomCode=code;playerId=p.id;host=false;showLobby();
 }catch(e){console.error(e);msg("방 참가 실패\n"+e.message)}
}
function showLobby(){
 start.classList.add("hidden");lobby.classList.remove("hidden");roomCodeEl=document.getElementById("roomCode");roomCodeEl.textContent=roomCode;
 document.getElementById("hostText").textContent=host?"👑 방장: "+document.getElementById("hostName").value.trim():"방장 확인 중";
 if(host)document.getElementById("hostStart").classList.remove("hidden");
 refreshLobby();clearInterval(poll);poll=setInterval(refreshRoom,1000);
}
async function refreshLobby(){
 let {data}=await sb.from("players").select("*").eq("room_id",roomId).order("created_at");
 let box=document.getElementById("lobbyPlayers");box.innerHTML="";
 (data||[]).forEach(p=>{let d=document.createElement("div");d.innerHTML=`<span>${esc(p.player_name)}${p.is_host?" 👑":""}</span><span>${p.id===playerId?"나":""}</span>`;box.appendChild(d)});
 document.getElementById("lobbyCount").textContent=`현재 ${data?.length||0}명 참가`;
}
async function startGame(){if(!host)return;let {error}=await sb.from("rooms").update({status:"playing",current_round:1,round_started_at:new Date().toISOString()}).eq("id",roomId);if(error)alert(error.message)}
async function refreshRoom(){
 let {data:r}=await sb.from("rooms").select("*").eq("id",roomId).single();if(!r)return;
 if(r.status==="playing"){roundNo=r.current_round; if(game.classList.contains("hidden"))showGame();else renderGame();}
 if(r.status==="finished"&&!final.classList.contains("hidden"))return;
 if(r.status==="finished")showFinal();
}
function showGame(){lobby.classList.add("hidden");game.classList.remove("hidden");renderGame()}
async function renderGame(){
 const rd=rounds[roundNo-1];if(!rd)return;
 document.getElementById("roundTitle").textContent=`ROUND ${rd.n} · ${rd.title}`;
 document.getElementById("roundDesc").textContent=rd.desc;
 document.getElementById("hostControl").classList.toggle("hidden",!host);
 document.getElementById("resultBox").classList.add("hidden");
 await stats();
 if(rd.type==="project"){normalBox.classList.add("hidden");projectBoxWrap.classList.remove("hidden");await renderProject(rd.project)}
 else{projectBoxWrap.classList.add("hidden");normalBox.classList.remove("hidden");await renderChoices(rd)}
 await ranking();
}
async function stats(){
 let {data:p}=await sb.from("players").select("*").eq("id",playerId).single();if(!p)return;
 money.textContent=p.money??1000;environment.textContent=p.environment??50;community.textContent=p.community??50;satisfaction.textContent=p.satisfaction??50;
}
async function renderChoices(rd){
 let {data:mine}=await sb.from("player_choices").select("choice_id").eq("room_id",roomId).eq("player_id",playerId).eq("round_number",roundNo).maybeSingle();
 selected=mine?.choice_id||null;choices.innerHTML="";
 rd.choices.forEach(c=>{let d=document.createElement("div");d.className="choice"+(selected===c.id?" sel":"");d.innerHTML=`<b>${c.t}</b><small>${c.d}</small>`;d.onclick=()=>{if(mine)return;selected=c.id;renderChoices(rd)};choices.appendChild(d)});
 confirm.disabled=!!mine||!selected;
 document.getElementById("statusMsg").textContent=mine?"✅ 선택 완료! 다른 참가자를 기다리는 중...":"선택을 골라주세요.";
}
async function confirmChoice(){
 if(!selected)return;
 let {error}=await sb.from("player_choices").upsert({room_id:roomId,player_id:playerId,round_number:roundNo,choice_id:selected},{onConflict:"room_id,player_id,round_number"});
 if(error)alert(error.message);else{confirm.disabled=true;document.getElementById("statusMsg").textContent="✅ 선택 완료! 다른 참가자를 기다리는 중..."}
}
async function renderProject(p){
 let {data:ps}=await sb.from("project_participants").select("*").eq("room_id",roomId).eq("project_id",p.id);
 let arr=ps||[],count=arr.length,joined=arr.some(x=>x.player_id===playerId),cost=count?Math.ceil(p.cost/count):p.cost;
 projectDesc.textContent=`총 비용 ${p.cost}원 · 최소 ${p.min}명 필요`;
 projectBox.innerHTML=`<strong>${p.name}</strong><div class="big">${count}명 참여</div><p>현재 예상 1인 부담금: <b>${cost}원</b></p><p>참여자가 늘어나면 1인 부담금이 내려갑니다.</p>${count<p.min?"❗ 아직 최소 인원 미달":"✅ 최소 인원 충족"}`;
 joinProject.disabled=joined;leaveProject.disabled=!joined;
 document.getElementById("statusMsg").textContent=joined?"✅ 프로젝트 참여 중":"원하면 프로젝트에 참여하세요.";
}
async function joinProject(){
 let p=rounds[roundNo-1].project;let {error}=await sb.from("project_participants").upsert({room_id:roomId,player_id:playerId,project_id:p.id},{onConflict:"room_id,player_id,project_id"});if(error)alert(error.message);else renderProject(p)
}
async function leaveProject(){
 let p=rounds[roundNo-1].project;let {error}=await sb.from("project_participants").delete().eq("room_id",roomId).eq("player_id",playerId).eq("project_id",p.id);if(error)alert(error.message);else renderProject(p)
}
async function resolveRound(){
 if(!host)return;
 const rd=rounds[roundNo-1];
 if(rd.type==="project")return resolveProject(rd.project);
 let {data:players}=await sb.from("players").select("*").eq("room_id",roomId);
 let {data:chs}=await sb.from("player_choices").select("*").eq("room_id",roomId).eq("round_number",roundNo);
 if((chs||[]).length<players.length){alert(`아직 선택하지 않은 참가자가 있습니다.\n현재 ${chs?.length||0}명 / ${players.length}명 선택`);return}
 for(const p of players){
  const rec=chs.find(x=>x.player_id===p.id);const c=rd.choices.find(x=>x.id===rec.choice_id);if(!c)continue;
  let m=(p.money??1000)+c.m,e=(p.environment??50)+c.e,co=(p.community??50)+c.c,s=(p.satisfaction??50)+c.s;
  let same=chs.filter(x=>x.choice_id===c.id).length;
  if(c.share&&same>=Math.ceil(players.length*.7))s-=5;
  await sb.from("players").update({money:m,environment:e,community:co,satisfaction:s}).eq("id",p.id);
 }
 resultBox.classList.remove("hidden");document.getElementById("resultText").innerHTML="모든 참가자의 선택이 반영되었습니다.<br><br>🏆 순위를 확인하세요.";await ranking();document.getElementById("hostControl").classList.add("hidden");
}
async function resolveProject(p){
 let {data:ps}=await sb.from("project_participants").select("*").eq("room_id",roomId).eq("project_id",p.id);
 let count=(ps||[]).length;
 if(count<p.min){resultBox.classList.remove("hidden");resultText.innerHTML=`❌ 프로젝트 실패<br><br>최소 ${p.min}명이 필요하지만 ${count}명만 참여했습니다.`;hostControl.classList.add("hidden");return}
 let cost=Math.ceil(p.cost/count);let {data:players}=await sb.from("players").select("*").eq("room_id",roomId);
 for(const x of ps){let q=players.find(z=>z.id===x.player_id);if(q)await sb.from("players").update({money:(q.money??1000)-cost,environment:(q.environment??50)+p.env,community:(q.community??50)+p.comm,satisfaction:(q.satisfaction??50)+p.sat}).eq("id",q.id)}
 resultBox.classList.remove("hidden");resultText.innerHTML=`🎉 공동 프로젝트 성공!<br><br>${count}명이 참여하여 1인 부담금은 ${cost}원이었습니다.<br>참여자에게 환경·공동체·만족도 보너스가 지급되었습니다.`;hostControl.classList.add("hidden");await ranking()
}
async function nextRound(){
 if(!host)return;
 if(roundNo>=TOTAL){await sb.from("rooms").update({status:"finished"}).eq("id",roomId);return}
 await sb.from("rooms").update({current_round:roundNo+1,round_started_at:new Date().toISOString()}).eq("id",roomId);
}
function calc(p){return Math.round((p.money??1000)/10+(p.environment??50)*2+(p.community??50)*2+(p.satisfaction??50)*2)}
async function ranking(){
 let {data:ps}=await sb.from("players").select("*").eq("room_id",roomId);let a=(ps||[]).map(p=>({...p,fs:calc(p)})).sort((x,y)=>y.fs-x.fs);
 rankingEl=document.getElementById("ranking");rankingEl.innerHTML="";a.forEach((p,i)=>{let d=document.createElement("div");d.innerHTML=`<span>${i+1}위 · ${esc(p.player_name)}${p.id===playerId?" ⭐":""}</span><b>${p.fs}점</b>`;rankingEl.appendChild(d)})
}
async function showFinal(){
 clearInterval(poll);game.classList.add("hidden");lobby.classList.add("hidden");final.classList.remove("hidden");
 let {data:ps}=await sb.from("players").select("*").eq("room_id",roomId);let a=(ps||[]).map(p=>({...p,fs:calc(p)})).sort((x,y)=>y.fs-x.fs);
 let box=document.getElementById("finalList");box.innerHTML="";
 a.forEach((p,i)=>{let style="⚖️ 균형형 시민",env=p.environment??50,co=p.community??50,m=(p.money??1000)/10;if(env>co&&env>m)style="🌱 친환경 시민";else if(co>env&&co>m)style="🤝 공유경제 시민";else if(m>env&&m>co)style="💰 경제형 시민";
 let d=document.createElement("div");d.className="card";d.innerHTML=`<h2>${i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"} ${i+1}위 · ${esc(p.player_name)}</h2><div class="score">${p.fs}점</div><div class="style">${style}</div><p>💰 ${p.money??1000} · 🌱 ${env} · 🤝 ${co} · 😊 ${p.satisfaction??50}</p>`;box.appendChild(d)})
}
</script>
