/* =========================================================
   공통 함수
========================================================= */

function esc(value){

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
}


function showStartMsg(text){

    const el = document.getElementById("startMsg");

    el.textContent = text;

    el.classList.remove("hidden");
}


function clearStartMsg(){

    document
        .getElementById("startMsg")
        .classList.add("hidden");
}


/* =========================================================
   방 만들기
========================================================= */

async function createRoom(){

    const name =
        document
        .getElementById("hostName")
        .value
        .trim();

    if(!name){

        showStartMsg(
            "방장 이름을 입력해주세요."
        );

        return;
    }


    const btn =
        document.getElementById("createRoomBtn");

    btn.disabled = true;

    clearStartMsg();


    try{

        let code = null;


        /* 방 번호 찾기 */

        for(let i=0;i<30;i++){

            const candidate =
                String(
                    Math.floor(
                        1000 +
                        Math.random() * 9000
                    )
                );


            const { data, error } =
                await sb
                .from("rooms")
                .select("id")
                .eq("room_code",candidate)
                .maybeSingle();


            if(error){

                throw error;
            }


            if(!data){

                code = candidate;

                break;
            }
        }


        if(!code){

            throw new Error(
                "사용 가능한 방 번호를 만들지 못했습니다."
            );
        }


        /* 방 생성 */

        const {
            data:r,
            error:roomError
        } =
            await sb
            .from("rooms")
            .insert({

                room_code:code,

                host_name:name,

                status:"waiting",

                current_round:0,

                round_started_at:null

            })
            .select()
            .single();


        if(roomError){

            throw roomError;
        }


        /* 방장 플레이어 생성 */

        const {
            data:p,
            error:playerError
        } =
            await sb
            .from("players")
            .insert({

                room_id:r.id,

                player_name:name,

                is_host:true,

                score:0,

                money:1000,

                environment:50,

                community:50,

                satisfaction:50

            })
            .select()
            .single();


        if(playerError){

            /* 플레이어 생성 실패 시 방도 삭제 시도 */

            await sb
                .from("rooms")
                .delete()
                .eq("id",r.id);

            throw playerError;
        }


        roomId = r.id;

        roomCode = code;

        playerId = p.id;

        isHost = true;


        showLobby();


    }catch(error){

        console.error(
            "방 만들기 오류:",
            error
        );

        showStartMsg(
            "방 만들기 실패\n" +
            (error.message || error)
        );

    }finally{

        btn.disabled = false;
    }
}

    if(!name){

        showStartMsg(
            "이름을 입력해주세요."
        );

        return;
    }


    if(!/^\d{4}$/.test(code)){

        showStartMsg(
            "4자리 방 번호를 입력해주세요."
        );

        return;
    }


    const btn =
        document.getElementById("joinRoomBtn");

    btn.disabled = true;

    clearStartMsg();


    try{

        const {
            data:r,
            error
        } =
            await sb
            .from("rooms")
            .select("*")
            .eq("room_code",code)
            .maybeSingle();


        if(error){

            throw error;
        }


        if(!r){

            showStartMsg(
                "존재하지 않는 방입니다."
            );

            return;
        }


        if(r.status !== "waiting"){

            showStartMsg(
                "이미 시작된 방입니다."
            );

            return;
        }


        /* 참가자 추가 */

        const {
            data:p,
            error:playerError
        } =
            await sb
            .from("players")
            .insert({

                room_id:r.id,

                player_name:name,

                is_host:false,

                score:0,

                money:1000,

                environment:50,

                community:50,

                satisfaction:50

            })
            .select()
            .single();


        if(playerError){

            throw playerError;
        }


        roomId = r.id;

        roomCode = code;

        playerId = p.id;

        isHost = false;


        showLobby();


    }catch(error){

        console.error(
            "방 참가 오류:",
            error
        );

        showStartMsg(
            "방 참가 실패\n" +
            (error.message || error)
        );

    }finally{

        btn.disabled = false;
    }
}

   로비 상태 + 게임 시작 감지
========================================================= */

async function refreshLobbyAndCheckGame(){

    if(!roomId){
        return;
    }


    await refreshLobby();


    const {
        data:r,
        error
    } =
        await sb
        .from("rooms")
        .select("*")
        .eq("id",roomId)
        .maybeSingle();


    if(error || !r){

        return;
    }


    if(r.status === "playing"){

        if(lobbyPoll){

            clearInterval(lobbyPoll);

            lobbyPoll = null;
        }


        roundNo =
            Number(r.current_round) || 1;


        showGame();
    }

}

        data:r,
        error
    } =
        await sb
        .from("rooms")
        .select("*")
        .eq("id",roomId)
        .maybeSingle();

/* =========================================================
   선택지 표시
   ★ 선택이 안 되던 부분을 완전히 수정
========================================================= */

async function renderChoices(rd){

    const choicesEl =
        document.getElementById("choices");

    const confirmBtn =
        document.getElementById("confirm");

    const statusEl =
        document.getElementById("statusMsg");


    if(!choicesEl){

        console.error(
            "choices 요소를 찾을 수 없습니다."
        );

        return;
    }


    /*
     * 현재 라운드에서
     * 내가 이미 선택했는지 확인
     */

    const {
        data:mine,
        error
    } =
        await sb
        .from("player_choices")
        .select("choice_id")
        .eq("room_id",roomId)
        .eq("player_id",playerId)
        .eq("round_number",roundNo)
        .maybeSingle();


    if(error){

        console.error(
            "선택 조회 오류:",
            error
        );

        statusEl.textContent =
            "선택 정보를 불러오지 못했습니다.";

        return;
    }


    /*
     * DB에 저장된 선택이 있으면
     * 그 값을 selected로 사용
     */

    selected =
        mine?.choice_id || null;


    /*
     * 선택지 초기화
     */

    choicesEl.innerHTML = "";


    /*
     * 각 선택지 생성
     */

    rd.choices.forEach(c => {

        const div =
            document.createElement("div");


        div.className =
            "choice";


        /*
         * 이미 선택한 경우 표시
         */

        if(selected === c.id){

            div.classList.add("sel");
        }


        div.innerHTML = `

            <b>${esc(c.t)}</b>

            <small>
                ${esc(c.d)}
            </small>

        `;


        /*
         * ★ 선택지 클릭 이벤트
         */

        div.addEventListener(
            "click",
            function(){

                /*
                 * 이미 확정한 경우 변경 불가
                 */

                if(mine){

                    return;
                }


                /*
                 * 선택값 저장
                 */

                selected = c.id;


                /*
                 * 모든 선택 표시 제거
                 */

                document
                    .querySelectorAll(
                        "#choices .choice"
                    )
                    .forEach(el => {

                        el.classList.remove(
                            "sel"
                        );

                    });


                /*
                 * 현재 선택 표시
                 */

                div.classList.add("sel");


                /*
                 * 확정 버튼 활성화
                 */

                confirmBtn.disabled = false;


                statusEl.textContent =
                    `선택됨: ${c.t}`;

            }
        );


        choicesEl.appendChild(div);

    });


    /*
     * 확정 여부에 따른 버튼 상태
     */

    confirmBtn.disabled =
        !!mine || !selected;


    if(mine){

        statusEl.textContent =
            "✅ 선택 완료! 다른 참가자를 기다리는 중...";

    }else{

        statusEl.textContent =
            "선택지를 하나 골라주세요.";
    }

}



/* =========================================================
   선택 확정

async function confirmChoice(){

        alert(

        );

    }


    const confirmBtn =
        document.getElementById("confirm");

    const statusEl =
        document.getElementById("statusMsg");


    confirmBtn.disabled = true;


    const {
        error
    } =
        await sb
        .from("player_choices")
        .upsert(

            {

                room_id:roomId,

                player_id:playerId,

                round_number:roundNo,

                choice_id:selected

            },

            {

                onConflict:
                    "room_id,player_id,round_number"

            }

        );


    if(error){

        console.error(
            "선택 저장 오류:",
            error
        );


        alert(
            "선택 저장에 실패했습니다.\n\n" +
            error.message
        );


        confirmBtn.disabled = false;

        return;
    }


    statusEl.textContent =
        "✅ 선택 완료! 다른 참가자를 기다리는 중...";


    /*
     * DB에 정상 저장됐으므로
     * 다시 렌더링하여 선택지를 잠근다.
     */

    await renderChoices(
        rounds[roundNo - 1]
    );

}



/* =========================================================
   공동 프로젝트
========================================================= */

async function renderProject(project){

    const {
        data:participants,
        error
    } =
        await sb
        .from("project_participants")
        .select("*")
        .eq("room_id",roomId)
        .eq("project_id",project.id);


    if(error){

        console.error(
            "프로젝트 조회 오류:",
            error
        );

        return;
    }


    const arr =
        participants || [];


    const count =
        arr.length;


    const joined =
        arr.some(
            x => x.player_id === playerId
        );


    const cost =
        count > 0
        ? Math.ceil(project.cost / count)
        : project.cost;


    document
        .getElementById("projectDesc")
        .textContent =
            `총 비용 ${project.cost}원 · 최소 ${project.min}명 필요`;


    document
        .getElementById("projectBox")
        .innerHTML = `

            <strong>
                ${esc(project.name)}
            </strong>

            <div class="big">
                ${count}명 참여
            </div>

            <p>
                현재 예상 1인 부담금:
                <b>${cost}원</b>
            </p>

            <p>
                참여자가 늘어나면
                1인 부담금이 내려갑니다.
            </p>

            ${
                count < project.min
                ? "❗ 아직 최소 인원 미달"
                : "✅ 최소 인원 충족"
            }

        `;


    document
        .getElementById("joinProject")
        .disabled =
            joined;


    document
        .getElementById("leaveProject")
        .disabled =
            !joined;


    document
        .getElementById("statusMsg")
        .textContent =
            joined
            ? "✅ 프로젝트 참여 중"
            : "원하면 프로젝트에 참여하세요.";
}

/* =========================================================
   라운드 결과 확인
========================================================= */

async function resolveRound(){

    if(!isHost){
        return;
    }


    if(resolving){
        return;
    }


    resolving = true;


    try{

        const rd =
            rounds[roundNo - 1];


        /*
         * 9라운드 공동 프로젝트
         */

        if(rd.type === "project"){

            await resolveProject(
                rd.project
            );

            return;
        }


        /*
         * 참가자 목록
         */

        const {
            data:players,
            error:playersError
        } =
            await sb
            .from("players")
            .select("*")
            .eq("room_id",roomId);


        if(playersError){

            throw playersError;
        }


        /*
         * 선택 목록
         */

        const {
            data:choicesData,
            error:choicesError
        } =
            await sb
            .from("player_choices")
            .select("*")
            .eq("room_id",roomId)
            .eq("round_number",roundNo);


        if(choicesError){

            throw choicesError;
        }


        const choices =
            choicesData || [];


        /*
         * 모두 선택했는지 확인
         */

        if(
            choices.length <
            players.length
        ){

            alert(

                "아직 선택하지 않은 참가자가 있습니다.\n\n" +

                `현재 ${choices.length}명 / ` +
                `${players.length}명 선택`

            );

            return;
        }


        /*
         * 모든 참가자의 선택 처리
         */

        for(const p of players){

            const rec =
                choices.find(
                    x => x.player_id === p.id
                );


            if(!rec){
                continue;
            }


            const c =
                rd.choices.find(
                    x => x.id === rec.choice_id
                );


            if(!c){
                continue;
            }


            let money =
                (p.money ?? 1000) +
                c.m;


            let environment =
                (p.environment ?? 50) +
                c.e;


            let community =
                (p.community ?? 50) +
                c.c;


            let satisfaction =
                (p.satisfaction ?? 50) +
                c.s;


            /*
             * 공유 선택을 너무 많은 사람이
             * 동시에 선택하면 만족도 페널티
             */

            const sameCount =
                choices.filter(
                    x =>
                        x.choice_id === c.id
                ).length;


            if(
                c.share &&
                sameCount >=
                Math.ceil(
                    players.length * 0.7
                )
            ){

                satisfaction -= 5;
            }


            /*
             * 값이 너무 낮아지지 않도록 보정
             */

            environment =
                Math.max(0,environment);

            community =
                Math.max(0,community);

            satisfaction =
                Math.max(0,satisfaction);


            await sb
                .from("players")
                .update({

                    money,

                    environment,

                    community,

                    satisfaction

                })
                .eq("id",p.id);
        }


        /*
         * 결과 화면
         */

        document
            .getElementById("resultBox")
            .classList.remove("hidden");


        document
            .getElementById("resultText")
            .innerHTML =
                "모든 참가자의 선택이 반영되었습니다." +
                "<br><br>" +
                "🏆 현재 순위를 확인하세요.";


        document
            .getElementById("hostControl")
            .classList.add("hidden");


        await stats();

        await ranking();

    }catch(error){

        console.error(
            "라운드 처리 오류:",
            error
        );


        alert(
            "라운드 결과 처리 실패\n" +
            error.message
        );

    }finally{

        resolving = false;
    }
}



/* =========================================================
   공동 프로젝트 결과
========================================================= */

async function resolveProject(project){

    const {
        data:participants,
        error
    } =
        await sb
        .from("project_participants")
        .select("*")
        .eq("room_id",roomId)
        .eq("project_id",project.id);


    if(error){

        throw error;
    }


    const arr =
        participants || [];


    const count =
        arr.length;


    /*
     * 최소 인원 미달
     */

    if(count < project.min){

        document
            .getElementById("resultBox")
            .classList.remove("hidden");


        document
            .getElementById("resultText")
            .innerHTML = `

                ❌ 공동 프로젝트 실패

                <br><br>

                최소 ${project.min}명이 필요하지만
                ${count}명만 참여했습니다.

            `;


        document
            .getElementById("hostControl")
            .classList.add("hidden");


        return;
    }


    /*
     * 1인 부담금
     */

    const cost =
        Math.ceil(
            project.cost / count
        );


    /*
     * 플레이어 가져오기
     */

    const {
        data:players,
        error:playersError
    } =
        await sb
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(playersError){

        throw playersError;
    }


    /*
     * 참여자에게 결과 적용
     */

    for(const participant of arr){

        const player =
            players.find(
                p =>
                    p.id ===
                    participant.player_id
            );


        if(!player){
            continue;
        }


        const money =
            (player.money ?? 1000) -
            cost;


        const environment =
            (player.environment ?? 50) +
            project.env;


        const community =
            (player.community ?? 50) +
            project.comm;


        const satisfaction =
            (player.satisfaction ?? 50) +
            project.sat;


        await sb
            .from("players")
            .update({

                money,

                environment,

                community,

                satisfaction

            })
            .eq("id",player.id);
    }


    /*
     * 결과 표시
     */

    document
        .getElementById("resultBox")
        .classList.remove("hidden");


    document
        .getElementById("resultText")
        .innerHTML = `

            🎉 공동 프로젝트 성공!

            <br><br>

            ${count}명이 참여하여
            1인 부담금은 ${cost}원이었습니다.

            <br><br>

            참여자에게
            환경·공동체·만족도 보너스가 지급되었습니다.

        `;


    document
        .getElementById("hostControl")
        .classList.add("hidden");


    await stats();

    await ranking();
}



/* =========================================================
   다음 라운드
========================================================= */

async function nextRound(){

    if(!isHost){
        return;
    }


    /*
     * 마지막 라운드였다면 종료
     */

    if(roundNo >= TOTAL_ROUNDS){

        const {
            error
        } =
            await sb
            .from("rooms")
            .update({

                status:"finished"

            })
            .eq("id",roomId);


        if(error){

            alert(
                "게임 종료 실패\n" +
                error.message
            );

            return;
        }


        showFinal();

        return;
    }


    /*
     * 다음 라운드
     */

    const next =
        roundNo + 1;


    const {
        error
    } =
        await sb
        .from("rooms")
        .update({

            current_round:next,

            round_started_at:
                new Date().toISOString()

        })
        .eq("id",roomId);


    if(error){

        alert(
            "다음 라운드 이동 실패\n" +
            error.message
        );

        return;
    }


    roundNo = next;

    selected = null;


    await renderGame();
}



/* =========================================================
   점수 계산
========================================================= */

function calc(player){

    return Math.round(

        (player.money ?? 1000) / 10 +

        (player.environment ?? 50) * 2 +

        (player.community ?? 50) * 2 +

        (player.satisfaction ?? 50) * 2

    );
}



/* =========================================================
   현재 순위
========================================================= */

async function ranking(){

    const {
        data:players,
        error
    } =
        await sb
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(error){

        console.error(
            "순위 조회 오류:",
            error
        );

        return;
    }


    const list =
        (players || [])
        .map(p =>({

            ...p,

            finalScore:calc(p)

        }))
        .sort(
            (a,b) =>
                b.finalScore -
                a.finalScore
        );


    const rankingEl =
        document.getElementById(
            "ranking"
        );


    rankingEl.innerHTML = "";


    list.forEach(
        (p,index) => {

            const div =
                document.createElement("div");


            div.innerHTML = `

                <span>

                    ${index + 1}위 ·
                    ${esc(p.player_name)}

                    ${
                        p.id === playerId
                        ? " ⭐"
                        : ""
                    }

                </span>

                <b>
                    ${p.finalScore}점
                </b>

            `;


            rankingEl.appendChild(div);

        }
    );
}



/* =========================================================
   최종 결과
========================================================= */

async function showFinal(){

    if(gamePoll){

        clearInterval(gamePoll);

        gamePoll = null;
    }


    document
        .getElementById("game")
        .classList.add("hidden");


    document
        .getElementById("lobby")
        .classList.add("hidden");


    document
        .getElementById("final")
        .classList.remove("hidden");


    const {
        data:players,
        error
    } =
        await sb
        .from("players")
        .select("*")
        .eq("room_id",roomId);


    if(error){

        console.error(
            "최종 결과 조회 오류:",
            error
        );

        return;
    }


    const list =
        (players || [])
        .map(p =>({

            ...p,

            finalScore:calc(p)

        }))
        .sort(
            (a,b) =>
                b.finalScore -
                a.finalScore
        );


    const box =
        document.getElementById(
            "finalList"
        );


    box.innerHTML = "";


    list.forEach(
        (p,index) => {

            let style =
                "⚖️ 균형형 시민";


            const env =
                p.environment ?? 50;


            const community =
                p.community ?? 50;


            const money =
                (p.money ?? 1000) / 10;


            const satisfaction =
                p.satisfaction ?? 50;


            if(
                env > community &&
                env > money
            ){

                style =
                    "🌱 친환경 시민";

            }else if(
                community > env &&
                community > money
            ){

                style =
                    "🤝 공유경제 시민";

            }else if(
                money > env &&
                money > community
            ){

                style =
                    "💰 경제형 시민";
            }


            const medal =
                index === 0
                ? "🥇"
                : index === 1
                ? "🥈"
                : index === 2
                ? "🥉"
                : "🏅";


            const div =
                document.createElement("div");


            div.className =
                "card";


            div.innerHTML = `

                <h2>

                    ${medal}

                    ${index + 1}위 ·
                    ${esc(p.player_name)}

                </h2>


                <div class="score">

                    ${p.finalScore}점

                </div>


                <div class="style">

                    ${style}

                </div>


                <p>

                    💰 ${p.money ?? 1000}

                    · 🌱 ${env}

                    · 🤝 ${community}

                    · 😊 ${satisfaction}

                </p>

            `;


            box.appendChild(div);

        }
    );
}
