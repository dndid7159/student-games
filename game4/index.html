function esc(x){

  const d=document.createElement("div");

  d.textContent=x;

  return d.innerHTML;
}


function msg(x){

  const e=document.getElementById("startMsg");

  e.textContent=x;

  e.classList.remove("hidden");
}


/* =====================================================
   방 만들기
===================================================== */

async function createRoom(){

  const name =
    document.getElementById("hostName")
    .value
    .trim();

  if(!name){

    msg("방장 이름을 입력해주세요.");

    return;
  }


  try{

    let code=null;


    for(let i=0;i<30;i++){

      const c =
        String(
          Math.floor(
            1000 +
            Math.random()*9000
          )
        );


      const {data,error} =
        await client
        .from("rooms")
        .select("id")
        .eq("room_code",c)
        .maybeSingle();


      if(error) throw error;


      if(!data){

        code=c;

        break;
      }

    }


    if(!code){

      throw new Error(
        "방 번호 생성 실패"
      );

    }


    const {
      data:r,
      error
    } =
      await client
      .from("rooms")
      .insert({

        room_code:code,

        host_name:name,

        status:"waiting",

        current_round:0

      })
      .select()
      .single();


    if(error) throw error;


    const {
      data:p,
      error:pe
    } =
      await client
      .from("players")
      .insert({

        room_id:r.id,

        player_name:name,

        is_host:true,

        score:0,

        money:1000,

        environment:50,

        community:50,

        satisfaction:50

      })
      .select()
      .single();


    if(pe) throw pe;


    roomId=r.id;

    roomCode=code;

    playerId=p.id;

    host=true;


    showLobby();

  }catch(e){

    console.error(e);

    msg(
      "방 만들기 실패\n"+
      e.message
    );

  }

}


/* =====================================================
   방 참가
===================================================== */

async function joinRoom(){

  const name =
    document
    .getElementById("joinName")
    .value
    .trim();

  const code =
    document
    .getElementById("joinCode")
    .value
    .trim();


  if(!name){

    msg("이름을 입력해주세요.");

    return;
  }


  if(!/^\d{4}$/.test(code)){

    msg(
      "4자리 방 번호를 입력해주세요."
    );

    return;
  }


  try{

    const {
      data:r,
      error
    } =
      await client
      .from("rooms")
      .select("*")
      .eq("room_code",code)
      .maybeSingle();


    if(error) throw error;


    if(!r){

      msg(
        "존재하지 않는 방입니다."
      );

      return;
    }


    if(r.status!=="waiting"){

      msg(
        "이미 시작된 방입니다."
      );

      return;
    }


    const {
      data:p,
      error:pe
    } =
      await client
      .from("players")
      .insert({

        room_id:r.id,

        player_name:name,

        is_host:false,

        score:0,

        money:1000,

        environment:50,

        community:50,

        satisfaction:50

      })
      .select()
      .single();


    if(pe) throw pe;


    roomId=r.id;

    roomCode=code;

    playerId=p.id;

    host=false;


    showLobby();

  }catch(e){

    console.error(e);

    msg(
      "방 참가 실패\n"+
      e.message
    );

  }

}


/* =====================================================
   로비
===================================================== */

function showLobby(){

  document
  .getElementById("start")
  .classList
  .add("hidden");


  document
  .getElementById("lobby")
  .classList
  .remove("hidden");


  document
  .getElementById("roomCode")
  .textContent=roomCode;


  document
  .getElementById("hostText")
  .textContent =
    host
    ? "👑 방장: "+document
      .getElementById("hostName")
      .value
      .trim()
    : "👑 방장 확인 중";


  if(host){

    document
    .getElementById("hostStart")
    .classList
    .remove("hidden");

  }


  refreshLobby();


  clearInterval(poll);


  poll =
    setInterval(
      refreshRoom,
      1000
    );

}


/* =====================================================
   로비 참가자 갱신
===================================================== */

async function refreshLobby(){

  if(!roomId) return;


  const {
    data
  } =
  await client
  .from("players")
  .select("*")

/* =====================================================
   ★ 선택지 렌더링
===================================================== */

async function renderChoices(rd){

  if(renderingChoices) return;

  renderingChoices=true;


  try{

    const {
      data:mine
    } =
    await client
    .from("player_choices")
    .select("choice_id")
    .eq("room_id",roomId)
    .eq("player_id",playerId)
    .eq("round_number",roundNo)
    .maybeSingle();


    selected =
      mine?.choice_id || null;


    const choicesBox =
      document.getElementById(
        "choices"
      );


    /*
      ★ 중요
      모바일에서 DOM이 계속 교체되는 동안
      터치 이벤트가 사라지는 문제를 막기 위해
      현재 선택지를 한 번에 생성한다.
    */

    choicesBox.innerHTML="";


    rd.choices.forEach(c=>{

      const d =
        document.createElement("div");


      d.className =
        "choice"+
        (
          selected===c.id
          ? " sel"
          : ""
        );


      d.dataset.choiceId=c.id;


      d.innerHTML=`

        <b>${c.t}</b>

        <small>${c.d}</small>

      `;


      /*
        ★ 모바일 핵심 수정
        onclick 대신 pointerup 사용
        → 마우스 / 터치 / 모바일 모두 대응
      */

      d.addEventListener(
        "pointerup",
        function(e){

          e.preventDefault();

          if(mine) return;

          if(
            e.pointerType==="mouse" &&
            e.button!==0
          ) return;

          selectChoice(
            c.id,
            rd
          );

        },
        {
          passive:false
        }
      );


      choicesBox.appendChild(d);

    });


    document
    .getElementById("confirm")
    .disabled =
      !!mine ||
      !selected;


    document
    .getElementById("statusMsg")
    .textContent =
      mine
      ? "✅ 선택 완료! 다른 참가자를 기다리는 중..."
      : "선택지를 눌러 하나를 선택하세요.";

  }finally{

    renderingChoices=false;

  }

}


/* =====================================================
   ★ 선택지 선택
===================================================== */

function selectChoice(
  choiceId,
  rd
){

  /*
    이미 확정된 선택이 있으면 무시
  */

  const confirmBtn =
    document.getElementById(
      "confirm"
    );


  if(confirmBtn.disabled)
    return;


  selected=choiceId;


  /*
    모든 선택지의 선택 상태 변경
  */

  document
  .querySelectorAll(
    "#choices .choice"
  )
  .forEach(el=>{

    el.classList.toggle(
      "sel",
      el.dataset.choiceId===choiceId
    );

  });


  confirmBtn.disabled=false;


  document
  .getElementById("statusMsg")
  .textContent =
    "☑️ 선택했습니다. 아래 '선택 확정' 버튼을 눌러주세요.";

}


/* =====================================================
   선택 확정
===================================================== */

async function confirmChoice(){

  if(!selected) return;


  const confirmBtn =
    document.getElementById(
      "confirm"
    );


  confirmBtn.disabled=true;


  const {
    error
  } =
  await client
  .from("player_choices")
  .upsert({

    room_id:roomId,

    player_id:playerId,

    round_number:roundNo,

    choice_id:selected

  },{
    onConflict:
      "room_id,player_id,round_number"
  });


  if(error){

    console.error(error);

    confirmBtn.disabled=false;

    alert(
      "선택 저장 실패\n"+
      error.message
    );

    return;

  }


  document
  .getElementById("statusMsg")
  .textContent =
    "✅ 선택 완료! 다른 참가자를 기다리는 중...";

}


/* =====================================================
   공동 프로젝트
===================================================== */

async function renderProject(p){

  const {
    data:ps
  } =
  await client
  .from("project_participants")
  .select("*")
  .eq("room_id",roomId)
  .eq("project_id",p.id);


  const arr=ps||[];

  const count=arr.length;

  const joined =
    arr.some(
      x=>x.player_id===playerId
    );


  const cost =
    count
    ? Math.ceil(p.cost/count)
    : p.cost;


  document
  .getElementById("projectDesc")
  .textContent =
    `총 비용 ${p.cost}원 · 최소 ${p.min}명 필요`;


  document
  .getElementById("projectBox")
  .innerHTML=`

    <strong>${p.name}</strong>

    <div class="big">
      ${count}명 참여
    </div>

    <p>
      현재 예상 1인 부담금:
      <b>${cost}원</b>
    </p>

    <p>
      참여자가 늘어나면
      1인 부담금이 내려갑니다.
    </p>

    ${
      count<p.min
      ? "❗ 아직 최소 인원 미달"
      : "✅ 최소 인원 충족"
    }

  `;


  document
  .getElementById("joinProject")
  .disabled=joined;


  document
  .getElementById("leaveProject")
  .disabled=!joined;


  document
  .getElementById("statusMsg")
  .textContent =
    joined
    ? "✅ 프로젝트 참여 중"
    : "원하면 프로젝트에 참여하세요.";

}


/* =====================================================

async function joinProject(){

  const {

async function leaveProject(){

/* =====================================================
   라운드 결과
===================================================== */

async function resolveRound(){

  if(!host) return;


  const rd =
    rounds[roundNo-1];


  if(rd.type==="project"){

    return resolveProject(
      rd.project
    );

  }


  const {
    data:players
  } =
  await client
  .from("players")
  .select("*")
  .eq("room_id",roomId);


  const {
    data:chs
  } =
  await client
  .from("player_choices")
  .select("*")
  .eq("room_id",roomId)
  .eq("round_number",roundNo);


  if(
    (chs||[]).length <
    players.length
  ){

    alert(
      `아직 선택하지 않은 참가자가 있습니다.\n현재 ${chs?.length||0}명 / ${players.length}명 선택`
    );

    return;

  }


  for(
    const p of players
  ){

    const rec =
      chs.find(
        x=>x.player_id===p.id
      );


    if(!rec) continue;


    const c =
      rd.choices.find(
        x=>x.id===rec.choice_id
      );


    if(!c) continue;


    let m =
      (p.money??1000)+c.m;


    let e =
      (p.environment??50)+c.e;


    let co =
      (p.community??50)+c.c;


    let s =
      (p.satisfaction??50)+c.s;


    const same =
      chs.filter(
        x=>x.choice_id===c.id
      ).length;


    if(
      c.share &&
      same>=Math.ceil(
        players.length*.7
      )
    ){

      s-=5;

    }


    await client
    .from("players")
    .update({

      money:m,

      environment:e,

      community:co,

      satisfaction:s

    })
    .eq("id",p.id);

  }


  document
  .getElementById("resultBox")
  .classList
  .remove("hidden");


  document
  .getElementById("resultText")
  .innerHTML =
    "모든 참가자의 선택이 반영되었습니다.<br><br>🏆 순위를 확인하세요.";


  await ranking();


  document
  .getElementById("hostControl")
  .classList
  .add("hidden");

}


/* =====================================================
   공동 프로젝트 결과
===================================================== */

async function resolveProject(p){

  const {
    data:ps
  } =
  await client
  .from("project_participants")
  .select("*")
  .eq("room_id",roomId)
  .eq("project_id",p.id);


  const count =
    (ps||[]).length;


  if(count<p.min){

    document
    .getElementById("resultBox")
    .classList
    .remove("hidden");


    document
    .getElementById("resultText")
    .innerHTML =
      `❌ 프로젝트 실패<br><br>최소 ${p.min}명이 필요하지만 ${count}명만 참여했습니다.`;


    document
    .getElementById("hostControl")
    .classList
    .add("hidden");


    return;

  }


  const cost =
    Math.ceil(
      p.cost/count
    );


  const {
    data:players
  } =
  await client
  .from("players")
  .select("*")
  .eq("room_id",roomId);


  for(
    const x of ps
  ){

    const q =
      players.find(
        z=>z.id===x.player_id
      );


    if(q){

      await client
      .from("players")
      .update({

        money:
          (q.money??1000)-cost,

        environment:
          (q.environment??50)+p.env,

        community:
          (q.community??50)+p.comm,

        satisfaction:
          (q.satisfaction??50)+p.sat

      })
      .eq("id",q.id);

    }

  }


  document
  .getElementById("resultBox")
  .classList
  .remove("hidden");


  document
  .getElementById("resultText")
  .innerHTML =
    `🎉 공동 프로젝트 성공!<br><br>${count}명이 참여하여 1인 부담금은 ${cost}원이었습니다.<br>참여자에게 환경·공동체·만족도 보너스가 지급되었습니다.`;


  document
  .getElementById("hostControl")
  .classList
  .add("hidden");


  await ranking();

}

async function nextRound(){

  if(!host) return;


  if(roundNo>=TOTAL){

    await client
    .from("rooms")
    .update({
      status:"finished"
    })
    .eq("id",roomId);


    return;

  }


  await client
  .from("rooms")
  .update({

    current_round:
      roundNo+1,

    round_started_at:
      new Date().toISOString()

  })
  .eq("id",roomId);

}


/* =====================================================
   점수 계산
===================================================== */

function calc(p){

  return Math.round(

    (p.money??1000)/10

    +

    (p.environment??50)*2

    +

    (p.community??50)*2

    +

    (p.satisfaction??50)*2

  );

}


/* =====================================================
   순위
===================================================== */

async function ranking(){

  const {
    data:ps
  } =
  await client
  .from("players")
  .select("*")
  .eq("room_id",roomId);


  const a =
    (ps||[])
    .map(
      p=>({
        ...p,
        fs:calc(p)
      })
    )
    .sort(
      (x,y)=>y.fs-x.fs
    );


  const rankingEl =
    document.getElementById(
      "ranking"
    );


  rankingEl.innerHTML="";


  a.forEach(
    (p,i)=>{

      const d =
        document.createElement(
          "div"
        );


      d.innerHTML=`

        <span>
          ${i+1}위 ·
          ${esc(p.player_name)}
          ${p.id===playerId?" ⭐":""}
        </span>

        <b>
          ${p.fs}점
        </b>

      `;


      rankingEl.appendChild(d);

    }
  );

}


/* =====================================================
   최종 결과
===================================================== */

async function showFinal(){

  clearInterval(poll);


  document
  .getElementById("game")
  .classList
  .add("hidden");


  document
  .getElementById("lobby")
  .classList
  .add("hidden");


  document
  .getElementById("final")
  .classList
  .remove("hidden");


  const {
    data:ps
  } =
  await client
  .from("players")
  .select("*")
  .eq("room_id",roomId);


  const a =
    (ps||[])
    .map(
      p=>({
        ...p,
        fs:calc(p)
      })
    )
    .sort(
      (x,y)=>y.fs-x.fs
    );


  const box =
    document.getElementById(
      "finalList"
    );


  box.innerHTML="";


  a.forEach(
    (p,i)=>{

      let style=
        "⚖️ 균형형 시민";


      const env =
        p.environment??50;


      const co =
        p.community??50;


      const m =
        (p.money??1000)/10;


      if(
        env>co &&
        env>m
      ){

        style=
          "🌱 친환경 시민";

      }else if(
        co>env &&
        co>m
      ){

        style=
          "🤝 공유경제 시민";

      }else if(
        m>env &&
        m>co
      ){

        style=
          "💰 경제형 시민";

      }


      const d =
        document.createElement(
          "div"
        );


      d.className="card";


      d.innerHTML=`

        <h2>
          ${
            i===0
            ?"🥇"
            :i===1
            ?"🥈"
            :i===2
            ?"🥉"
            :"🏅"
          }

          ${i+1}위 ·
          ${esc(p.player_name)}
        </h2>

        <div class="score">
          ${p.fs}점
        </div>

        <div class="style">
          ${style}
        </div>

        <p>
          💰 ${p.money??1000}
          · 🌱 ${env}
          · 🤝 ${co}
          · 😊 ${p.satisfaction??50}
        </p>

      `;


      box.appendChild(d);

    }
  );

}
