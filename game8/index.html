<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마음 나침반 - 자기표현 4단계 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            user-select: none;
        }

        /* Animations */
        @keyframes pulse-breathe {
            0% { transform: scale(1); opacity: 0.8; background-color: #60a5fa; }
            100% { transform: scale(2.5); opacity: 0.3; background-color: #34d399; }
        }

        @keyframes pop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-pop { animation: pop 0.3s ease-out; }
        .animate-slide-in { animation: slideIn 0.5s ease-out forwards; }
        
        .chat-bubble-left {
            position: relative;
            background: #ffffff;
            border-radius: .4em;
            padding: 12px 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .chat-bubble-left::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 0;
            border: 10px solid transparent;
            border-right-color: #ffffff;
            border-left: 0;
            border-top: 0;
            margin-top: -5px;
            margin-left: -10px;
        }

        .step-indicator { transition: all 0.3s ease; }
        
        /* Custom Scrollbar for hidden elements if needed */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="game-container" class="w-full max-w-md h-[100dvh] sm:h-[800px] bg-gray-50 sm:rounded-2xl sm:shadow-2xl overflow-hidden flex flex-col relative">
        
        <!-- Header & Progress -->
        <header id="header" class="bg-white p-4 shadow-sm z-10 hidden flex-col">
            <div class="flex justify-between items-center mb-2">
                <button onclick="renderScreen('select_scenario')" class="text-xs text-gray-500 hover:text-indigo-600 flex items-center gap-1 font-bold">
                    <span>←</span> 상황 목록
                </button>
                <h1 class="font-bold text-gray-800 text-sm" id="header-scenario-title">자기표현 4단계</h1>
            </div>
            <div class="flex justify-between items-center relative px-2">
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 -z-10 rounded"></div>
                <div id="progress-bar" class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-indigo-500 -z-10 transition-all duration-500 rounded w-0"></div>
                
                <div class="step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500" data-step="1">멈춤</div>
                <div class="step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500" data-step="2">자각</div>
                <div class="step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500" data-step="3">조절</div>
                <div class="step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500" data-step="4">표현</div>
            </div>
        </header>

        <!-- Screens Content Area -->
        <main id="content-area" class="flex-grow flex flex-col relative overflow-y-auto">
            <!-- Content gets injected here by JS -->
        </main>

        <!-- Custom Toast Notification -->
        <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap text-sm">
            메시지
        </div>
    </div>

                ],

                    { id: 'feeling', text: "나는 억울하고 속상해.", type: "나의 감정" },

                    { id: 'wish', text: "단톡에서 이야기하기전에 직접 만나서 오해를 풀었으면 좋겠어.", type: "바람/요청" }

                sender: "친구 박민수",
                message: "야 저번에 빌려간 운동화 신다가 좀 더러워졌는데 걍 써라~ 별거 아니지?",
                emotions: [
                    { id: 1, text: "속상함", correct: true },

                    { id: 5, text: "배신감", correct: true },
                    { id: 6, text: "안도감", correct: false },
                    { id: 7, text: "황당함", correct: true },
                    { id: 8, text: "기쁨", correct: false }
                ],
                imessageParts: [
                    { id: 'action', text: "소중히 여기는 물건이 더러워진 상태로 돌아왔을 때", type: "행동/상황" },
                    { id: 'feeling', text: "나는 속상하고 존중받지 못한 느낌이 들어.", type: "나의 감정" },
                    { id: 'reason', text: "아끼는 물건인데 배려받지 못했다고 느껴지기 때문이야.", type: "이유" },
                    { id: 'wish', text: "다음부터는 물건을 깨끗이 사용하거나 세탁해서 반납해주면 좋겠어.", type: "바람/요청" }
                ],

            },
            {

                description: "약속 장소에 도착했는데 친구가 당일 귀찮다며 취소합니다.",
                sender: "친구 최성민",
                message: "나 오늘 귀찮아서 안 나감ㅋㅋ 밖에서 기다리고 있었냐? 쏘리~",
                emotions: [
                    { id: 1, text: "허탈함", correct: true },
                    { id: 2, text: "설렘", correct: false },
                    { id: 3, text: "화남", correct: true },
                    { id: 4, text: "감사함", correct: false },
                    { id: 5, text: "서운함", correct: true },
                    { id: 6, text: "행복함", correct: false },
                    { id: 7, text: "불쾌함", correct: true },
                    { id: 8, text: "상쾌함", correct: false }
                ],
                imessageParts: [
                    { id: 'action', text: "약속 장소에 이미 나왔는데 당일에 갑자기 취소통보를 들으니", type: "행동/상황" },
                    { id: 'feeling', text: "나는 허탈하고 마음이 상해.", type: "나의 감정" },
                    { id: 'reason', text: "너와의 약속을 위해 미리 시간을 비우고 준비했기 때문이야.", type: "이유" },
                    { id: 'wish', text: "앞으로는 피치 못할 사정이 생기면 미리 연락해줬으면 좋겠어.", type: "바람/요청" }
                ],
                reply: "생각 없이 당일 취소해서 미안해... 차비랑 시간 버리게 해서 정말 미안!"
            }
        ];

        // Utility: Show Toast Message
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `absolute top-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg shadow-lg transition-opacity duration-300 z-50 whitespace-nowrap text-sm font-bold ${isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // Utility: Update Header Progress
        function updateProgress(stepNumber) {
            const header = document.getElementById('header');
            const scenarioTitle = document.getElementById('header-scenario-title');
            
            if (stepNumber === 0) {
                header.classList.add('hidden');
                header.classList.remove('flex');
                return;
            } else {
                header.classList.remove('hidden');
                header.classList.add('flex');
                scenarioTitle.textContent = scenarios[state.selectedScenarioIndex].title;
            }

            const indicators = document.querySelectorAll('.step-indicator');
            const progressBar = document.getElementById('progress-bar');
            
            indicators.forEach((ind, index) => {
                if (index < stepNumber) {
                    ind.className = 'step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-indigo-500 text-white shadow-md animate-pop';
                } else {
                    ind.className = 'step-indicator w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500';
                }
            });

            const progressPercentage = (stepNumber - 1) * (100 / 3);
            progressBar.style.width = `${progressPercentage}%`;
        }

        function renderScreen(screenName) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = ''; // Clear current content
            state.currentScreen = screenName;

            switch(screenName) {
                case 'select_scenario':
                    updateProgress(0);
                    renderScenarioSelect(contentArea);
                    break;
                case 'intro':
                    updateProgress(0);
                    renderIntro(contentArea);
                    break;
                case 'step1':
                    updateProgress(1);
                    renderStep1(contentArea);
                    break;
                case 'step2':
                    updateProgress(2);
                    renderStep2(contentArea);
                    break;
                case 'step3':
                    updateProgress(3);
                    renderStep3(contentArea);
                    break;
                case 'step4':
                    updateProgress(4);
                    renderStep4(contentArea);
                    break;
                case 'outro':
                    updateProgress(4); // Keep full
                    renderOutro(contentArea);
                    break;
            }
        }

        function renderScenarioSelect(container) {
            const html = `
                <div class="flex-grow flex flex-col p-6 animate-slide-in">
                    <div class="text-center mb-6">
                        <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">자기표현 4단계 실습</span>
                        <h2 class="text-2xl font-black text-gray-800 mt-2">상황을 선택하세요</h2>
                        <p class="text-gray-500 text-xs mt-1">내가 경험했을 법한 갈등 상황을 고르고<br>4단계 표현법을 연습해보세요!</p>
                    </div>

                    <div class="flex-grow space-y-3 overflow-y-auto pr-1">
                        ${scenarios.map((sc, index) => `
                            <div onclick="selectScenario(${index})" class="bg-white border-2 border-gray-200 hover:border-indigo-500 rounded-xl p-4 cursor-pointer transition-all hover:shadow-md active:scale-98 flex items-start space-x-3">
                                <div class="text-3xl bg-indigo-50 p-2 rounded-lg flex-shrink-0">${sc.icon}</div>
                                <div class="flex-grow">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="font-bold text-gray-800 text-base">${sc.title}</span>
                                        <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-semibold">${sc.category}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 leading-relaxed break-keep">${sc.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function selectScenario(index) {
            state.selectedScenarioIndex = index;
            renderScreen('intro');
        }

        function renderIntro(container) {
            const sc = scenarios[state.selectedScenarioIndex];
            const html = `
                <div class="flex-grow flex flex-col items-center justify-center p-6 animate-slide-in">
                    <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-3xl mb-3 shadow-sm">
                        ${sc.icon}
                    </div>
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full mb-2">${sc.category}</span>
                    <h2 class="text-2xl font-bold text-gray-800 mb-1">${sc.title}</h2>
                    <p class="text-gray-500 text-xs text-center mb-6 break-keep">${sc.description}</p>
                    
                    <div class="w-full bg-[#b2c7d9] p-4 rounded-xl mb-6 shadow-inner">
                        <div class="text-xs text-gray-600 mb-2 text-center">오늘 오후 3:15</div>
                        <div class="flex items-start mb-2">
                            <div class="w-8 h-8 bg-gray-300 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold mr-2 text-gray-700">${sc.sender[0]}</div>
                            <div>
                                <div class="text-xs text-gray-700 mb-1">${sc.sender}</div>
                                <div class="chat-bubble-left text-sm text-gray-800 break-keep">
                                    ${sc.message}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-red-500 font-bold text-sm mb-6 text-center animate-pulse break-keep">
                        갑자기 감정이 욱하고 치밀어 오릅니다! <br>어떻게 현명하게 자기표현을 시작해볼까요?
                    </div>

                    <button onclick="renderScreen('step1')" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg btn-press hover:bg-indigo-700">
                        1단계: 멈춤 시작하기
                    </button>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderStep1(container) {
            state.step1.position = 0;
            state.step1.direction = 1;
            
            const html = `
                <div class="flex-grow flex flex-col p-6 animate-slide-in">
                    <div class="text-indigo-600 font-bold text-sm mb-1">1단계: 멈춤 (Pause)</div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">욱하는 마음 멈추기</h2>
                    <p class="text-gray-600 text-xs mb-8 break-keep">
                        충동적으로 화를 내거나 감정적인 답장을 보내기 전에 <b>행동을 멈추는 것</b>이 최우선입니다. <br>
                        커서가 초록색 안전지대에 왔을 때 'STOP' 버튼을 누르세요!
                    </p>

                    <div class="flex-grow flex flex-col items-center justify-center w-full">
                        <div class="w-full h-12 bg-gray-200 rounded-full relative overflow-hidden shadow-inner border-2 border-gray-300 mb-8">
                            <!-- Target Area (center 20%) -->
                            <div class="absolute top-0 left-[40%] w-[20%] h-full bg-green-400 opacity-50"></div>
                            <div class="absolute top-0 left-[40%] w-[20%] h-full border-x-2 border-green-600"></div>
                            
                            <!-- Moving Cursor -->
                            <div id="gauge-cursor" class="absolute top-0 left-0 w-4 h-full bg-red-500 rounded-full shadow-md transform -translate-x-1/2"></div>
                        </div>

                        <button id="stop-btn" class="w-40 h-40 rounded-full bg-red-500 text-white font-black text-3xl shadow-[0_10px_0_0_#991b1b] btn-press flex items-center justify-center flex-col active:shadow-none active:translate-y-2 transition-all">
                            <span>STOP!</span>
                            <span class="text-xs font-normal mt-2 opacity-80">터치해서 멈추기</span>
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            const cursor = document.getElementById('gauge-cursor');
            const stopBtn = document.getElementById('stop-btn');
            
            state.step1.speed = 3 + Math.random() * 2; 
            state.step1.isAnimating = true;

            function animateGauge() {
                if (!state.step1.isAnimating) return;

                state.step1.position += state.step1.speed * state.step1.direction;
                
                if (state.step1.position >= 100) {
                    state.step1.position = 100;
                    state.step1.direction = -1;
                } else if (state.step1.position <= 0) {
                    state.step1.position = 0;
                    state.step1.direction = 1;
                }

                cursor.style.left = `${state.step1.position}%`;
                state.step1.reqId = requestAnimationFrame(animateGauge);
            }

            animateGauge();

            stopBtn.addEventListener('click', () => {
                if (!state.step1.isAnimating) return;
                
                state.step1.isAnimating = false;
                cancelAnimationFrame(state.step1.reqId);
                
                // Check success (40% to 60%)
                if (state.step1.position >= 40 && state.step1.position <= 60) {
                    cursor.classList.remove('bg-red-500');
                    cursor.classList.add('bg-green-600');
                    showToast("성공! 충동을 잘 멈췄습니다.", false);
                    setTimeout(() => renderScreen('step2'), 1500);
                } else {
                    showToast("실패! 초록색 영역에 맞춰 다시 시도해보세요.", true);
                    setTimeout(() => {
                        state.step1.isAnimating = true;
                        animateGauge();
                    }, 1000);
                }
            });
        }

        function renderStep2(container) {
            state.step2.selected = [];
            const sc = scenarios[state.selectedScenarioIndex];
            
            // Shuffle emotions
            const shuffledEmotions = [...sc.emotions].sort(() => Math.random() - 0.5);

            const html = `
                <div class="flex-grow flex flex-col p-6 animate-slide-in">
                    <div class="text-indigo-600 font-bold text-sm mb-1">2단계: 자각 (Awareness)</div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">내 진짜 감정 알아차리기</h2>
                    <p class="text-gray-600 text-xs mb-6 break-keep">
                        행동을 멈췄다면 <b>지금 내 마음속 감정이 어떤지 정확히 들여다보는 것</b>이 중요합니다.<br>
                        이 상황에서 느껴지는 감정 3가지를 선택해보세요.
                    </p>

                    <div class="grid grid-cols-2 gap-3 mb-8">
                        ${shuffledEmotions.map(emo => `
                            <button onclick="toggleEmotion(${emo.id}, this)" class="emotion-btn bg-white border-2 border-gray-200 rounded-xl py-3 text-gray-700 font-bold transition-all shadow-sm text-sm">
                                ${emo.text}
                            </button>
                        `).join('')}
                    </div>

                    <div class="mt-auto">
                        <button onclick="checkStep2()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg btn-press opacity-50 cursor-not-allowed transition-opacity" id="step2-next-btn" disabled>
                            3개 선택완료 (0/3)
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function toggleEmotion(id, btnElement) {
            const index = state.step2.selected.indexOf(id);
            
            if (index > -1) {
                state.step2.selected.splice(index, 1);
                btnElement.classList.remove('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
                btnElement.classList.add('border-gray-200', 'bg-white', 'text-gray-700');
            } else {
                if (state.step2.selected.length < 3) {
                    state.step2.selected.push(id);
                    btnElement.classList.remove('border-gray-200', 'bg-white', 'text-gray-700');
                    btnElement.classList.add('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
                } else {
                    showToast("이미 3개를 선택했습니다.", true);
                }
            }

            const nextBtn = document.getElementById('step2-next-btn');
            nextBtn.textContent = `확인하기 (${state.step2.selected.length}/3)`;
            
            if (state.step2.selected.length === 3) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                nextBtn.classList.add('hover:bg-indigo-700');
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                nextBtn.classList.remove('hover:bg-indigo-700');
            }
        }

        function checkStep2() {
            const sc = scenarios[state.selectedScenarioIndex];
            let correctCount = 0;
            state.step2.selected.forEach(id => {
                const emo = sc.emotions.find(e => e.id === id);
                if (emo && emo.correct) correctCount++;
            });

            if (correctCount >= 2) {
                showToast("훌륭해요! 내 감정을 잘 알아차렸네요.", false);
                setTimeout(() => renderScreen('step3'), 1500);
            } else {
                showToast("현재 상황과 어울리는 감정을 다시 선택해보세요!", true);
            }
        }

        function renderStep3(container) {
            state.step3 = { isHolding: false, currentPhase: 'inhale', cycle: 0, progress: 0, animationFrame: null };
            
            const html = `
                <div class="flex-grow flex flex-col p-6 animate-slide-in relative">
                    <div class="text-indigo-600 font-bold text-sm mb-1">3단계: 조절 (Regulation)</div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">심호흡으로 마음 침착하게</h2>
                    <p class="text-gray-600 text-xs mb-8 break-keep">
                        감정을 알아차렸다면 이제 <b>격해진 몸과 마음의 신체 반응을 이완시킬 차례</b>입니다.<br>
                        버튼을 누른 채로 숨을 들이마시고, 떼면서 숨을 내쉬세요. (총 3회)
                    </p>

                    <div class="flex-grow flex flex-col items-center justify-center">
                        <div class="relative w-48 h-48 mb-12 flex items-center justify-center">
                            <!-- Breathing Circle -->
                            <div id="breath-circle" class="absolute w-24 h-24 bg-blue-200 rounded-full transition-all duration-[3000ms] ease-in-out opacity-80 shadow-[0_0_30px_rgba(96,165,250,0.5)]"></div>
                            <div id="breath-text" class="relative z-10 text-gray-800 font-bold text-lg pointer-events-none">준비</div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full max-w-xs h-3 bg-gray-200 rounded-full mb-8 overflow-hidden">
                            <div id="breath-progress" class="h-full bg-blue-500 w-0 transition-all duration-[3000ms] ease-linear"></div>
                        </div>
                        
                        <div class="flex space-x-2 mb-4 text-xs font-bold text-gray-400">
                            <div id="cycle-1" class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center">1</div>
                            <div id="cycle-2" class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center">2</div>
                            <div id="cycle-3" class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center">3</div>
                        </div>

                        <button id="breathe-btn" class="w-full bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_6px_0_0_#2563eb] btn-press select-none">
                            여기를 길게 누르세요
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            const btn = document.getElementById('breathe-btn');
            const circle = document.getElementById('breath-circle');
            const text = document.getElementById('breath-text');
            const progress = document.getElementById('breath-progress');
            let timeoutId = null;

            function startInhale() {
                if (state.step3.cycle >= 3) return;
                state.step3.isHolding = true;
                
                text.textContent = "들이마시기...";
                circle.style.transform = 'scale(2.2)';
                circle.style.backgroundColor = '#60a5fa';
                progress.style.width = '100%';
                progress.style.backgroundColor = '#60a5fa';
                btn.textContent = "누르고 유지하세요";
                btn.classList.add('translate-y-2', 'shadow-none');
                btn.classList.replace('bg-blue-500', 'bg-blue-600');

                timeoutId = setTimeout(() => {
                    if (state.step3.isHolding) {
                        text.textContent = "이제 떼세요!";
                        btn.textContent = "버튼에서 손 떼기";
                        btn.classList.replace('bg-blue-600', 'bg-green-500');
                        btn.classList.replace('shadow-[0_6px_0_0_#2563eb]', 'shadow-[0_6px_0_0_#16a34a]');
                        state.step3.currentPhase = 'exhale_ready';
                        navigator.vibrate && navigator.vibrate(50);
                    }
                }, 3000);
            }

            function startExhale() {
                if (!state.step3.isHolding) return;
                state.step3.isHolding = false;
                clearTimeout(timeoutId);

                btn.classList.remove('translate-y-2', 'shadow-none');

                if (state.step3.currentPhase === 'exhale_ready') {
                    text.textContent = "내쉬기...";
                    circle.style.transform = 'scale(1)';
                    circle.style.backgroundColor = '#34d399';
                    progress.style.width = '0%';
                    progress.style.backgroundColor = '#34d399';
                    btn.textContent = "숨을 끝까지 내쉬세요";
                    btn.disabled = true;
                    btn.classList.add('opacity-70');

                    setTimeout(() => {
                        state.step3.cycle++;
                        document.getElementById(`cycle-${state.step3.cycle}`).classList.replace('border-gray-300', 'border-indigo-500');
                        document.getElementById(`cycle-${state.step3.cycle}`).classList.add('bg-indigo-100', 'text-indigo-600');
                        
                        if (state.step3.cycle >= 3) {
                            text.textContent = "완료!";
                            showToast("마음이 차분해졌습니다.", false);
                            setTimeout(() => renderScreen('step4'), 1500);
                        } else {
                            resetBreathingUI();
                        }
                    }, 3000);

                } else {
                    showToast("3초 동안 길게 눌러주세요!", true);
                    resetBreathingUI();
                }
            }

            function resetBreathingUI() {
                text.textContent = "준비";
                circle.style.transform = 'scale(1)';
                circle.style.backgroundColor = '#bfdbfe';
                progress.style.width = '0%';
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                btn.textContent = "여기를 길게 누르세요";
                btn.className = "w-full bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_6px_0_0_#2563eb] btn-press select-none transition-all";
                state.step3.currentPhase = 'inhale';
            }

            btn.addEventListener('mousedown', (e) => { e.preventDefault(); startInhale(); });
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startInhale(); });
            
            document.addEventListener('mouseup', startExhale);
            document.addEventListener('touchend', startExhale);
        }

        function renderStep4(container) {
            state.step4.selectedOrder = [];
            const sc = scenarios[state.selectedScenarioIndex];
            let availableParts = [...sc.imessageParts].sort(() => Math.random() - 0.5);

            const html = `
                <div class="flex-grow flex flex-col p-6 animate-slide-in">
                    <div class="text-indigo-600 font-bold text-sm mb-1">4단계: 표현 (Expression)</div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">'나 전달법' 퍼즐 완성</h2>
                    <p class="text-gray-600 text-xs mb-4 break-keep">
                        상대방을 비난하지 않고 <b>나의 상황, 감정, 이유, 바람을 솔직히 표현하는 '나 전달법(I-Message)'</b>을 완성하세요.
                    </p>

                    <!-- Slots -->
                    <div class="flex flex-col space-y-2 mb-4" id="slots-container">
                        ${sc.imessageParts.map((part, index) => `
                            <div class="flex items-center">
                                <div class="w-16 text-xs font-bold text-indigo-500 flex-shrink-0">${part.type}</div>
                                <div id="slot-${index}" class="flex-grow min-h-[2.8rem] border-2 border-dashed border-gray-300 rounded-lg p-2 flex items-center text-xs text-gray-500 bg-gray-50 transition-colors cursor-pointer" onclick="returnPiece(${index})">
                                    터치해서 순서대로 채우세요
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <hr class="border-gray-200 mb-4">

                    <!-- Available Pieces -->
                    <div class="flex flex-col space-y-2 mb-6" id="pieces-container">
                        ${availableParts.map((part) => `
                            <button id="piece-${part.id}" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-left text-xs text-gray-800 shadow-sm font-medium hover:bg-gray-50 active:bg-gray-100 transition-all" onclick="placePiece('${part.id}', '${part.text}')">
                                ${part.text}
                            </button>
                        `).join('')}
                    </div>

                    <div class="mt-auto">
                        <button onclick="checkStep4()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg btn-press opacity-50 cursor-not-allowed transition-opacity" id="step4-next-btn" disabled>
                            퍼즐을 모두 맞춰주세요
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function placePiece(partId, text) {
            const slotIndex = state.step4.selectedOrder.findIndex(item => item === null);
            let targetIndex = slotIndex === -1 ? state.step4.selectedOrder.length : slotIndex;

            if (targetIndex >= 4) return;

            state.step4.selectedOrder[targetIndex] = partId;
            
            const slot = document.getElementById(`slot-${targetIndex}`);
            slot.textContent = text;
            slot.classList.replace('border-dashed', 'border-solid');
            slot.classList.replace('border-gray-300', 'border-indigo-500');
            slot.classList.replace('bg-gray-50', 'bg-indigo-50');
            slot.classList.replace('text-gray-500', 'text-gray-800');

            document.getElementById(`piece-${partId}`).style.display = 'none';

            checkCompletionStep4();
        }

        function returnPiece(slotIndex) {
            const partId = state.step4.selectedOrder[slotIndex];
            if (!partId) return;

            state.step4.selectedOrder[slotIndex] = null;

            const slot = document.getElementById(`slot-${slotIndex}`);
            slot.textContent = '터치해서 순서대로 채우세요';
            slot.className = "flex-grow min-h-[2.8rem] border-2 border-dashed border-gray-300 rounded-lg p-2 flex items-center text-xs text-gray-500 bg-gray-50 transition-colors cursor-pointer";

            document.getElementById(`piece-${partId}`).style.display = 'block';

            checkCompletionStep4();
        }

        function checkCompletionStep4() {
            const btn = document.getElementById('step4-next-btn');
            const isFull = state.step4.selectedOrder.length === 4 && !state.step4.selectedOrder.includes(null);
            
            if (isFull) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-indigo-700');
                btn.textContent = "나 전달법 전송하기";
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-indigo-700');
                btn.textContent = "퍼즐을 모두 맞춰주세요";
            }
        }

        function checkStep4() {
            const correctOrder = ['action', 'feeling', 'reason', 'wish'];
            const currentOrder = state.step4.selectedOrder;

            let isCorrect = true;
            for (let i = 0; i < 4; i++) {
                if (currentOrder[i] !== correctOrder[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                showToast("완벽해요! 멋진 나 전달법입니다.", false);
                setTimeout(() => renderScreen('outro'), 1500);
            } else {
                showToast("순서가 틀렸어요. 상황 -> 감정 -> 이유 -> 바람 순서대로 연결해보세요.", true);
            }
        }

        function renderOutro(container) {
            const sc = scenarios[state.selectedScenarioIndex];
            const fullMessage = sc.imessageParts.map(p => p.text).join(' ');

            const html = `
                <div class="flex-grow flex flex-col items-center justify-center p-6 animate-slide-in text-center">
                    <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-3xl mb-4 shadow-md">
                        🎉
                    </div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">대단해요! 해결 완료!</h2>
                    <p class="text-gray-600 text-xs mb-6 break-keep">
                        충동적으로 화를 내는 대신<br>
                        <b>멈춤 - 자각 - 조절 - 표현</b>으로 건강하게 대화했습니다.
                    </p>

                    <div class="w-full bg-[#b2c7d9] p-4 rounded-xl mb-6 shadow-inner relative text-left">
                        <div class="text-[10px] text-gray-600 mb-2 text-center">오늘 오후 3:20</div>
                        
                        <div class="flex flex-col items-end mb-4">
                            <div class="bg-[#fef01b] rounded-lg p-3 text-xs text-gray-800 break-keep shadow-sm max-w-[90%] text-left relative">
                                ${fullMessage}
                            </div>
                        </div>

                        <div class="flex items-start mt-4">
                            <div class="w-8 h-8 bg-gray-300 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold mr-2 text-gray-700">${sc.sender[0]}</div>
                            <div>
                                <div class="text-[10px] text-gray-600 mb-1">${sc.sender}</div>
                                <div class="chat-bubble-left text-xs text-gray-800 break-keep">
                                    ${sc.reply}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="w-full space-y-2">
                        <button onclick="renderScreen('select_scenario')" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg btn-press hover:bg-indigo-700 text-sm">
                            다른 상황 해결해보기
                        </button>
                        <button onclick="renderScreen('intro')" class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-xl btn-press hover:bg-gray-300 text-sm">
                            이 상황 다시 하기
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // Initialize Game
        window.onload = function() {
            renderScreen('select_scenario');
        };
    </script>
</body>
</html>
